 try{
  const code = $("#cusCode").value.trim();
  if(!/^\d{6}$/.test(code)){ alert("请输入6位基金代码"); return; }
  const type = $("#cusType").value;
  let kind="fund", market="";
  if(type==="etf-sh"){ kind="etf"; market="sh"; }
  else if(type==="etf-sz"){ kind="etf"; market="sz"; }

  // 持仓数据（可选）
  const costRaw = $("#cusCost").value.trim();
  const sharesRaw = $("#cusShares").value.trim();
  let cost = null, shares = null;
  if(costRaw){ cost = parseFloat(costRaw); if(isNaN(cost)||cost<=0){ alert("成本净值要填正数"); return; } }
  if(sharesRaw){ shares = parseFloat(sharesRaw); if(isNaN(shares)||shares<=0){ alert("持有份额要填正数"); return; } }
  // 二者要么都填、要么都不填
  if((cost!=null) !== (shares!=null)){ alert("成本净值和持有份额需同时填写，或同时留空（仅观察）"); return; }

  // 先查重，避免白等网络
  const list0 = getCustoms();
  if(list0.some(x=>x.code===code)){ alert("该基金已在持仓列表"); return; }

  // 立即保存 + 刷新列表（name 先用代码占位），保证点击有即时反馈
  const item = {code, kind, market, name:code};
  if(cost!=null && shares!=null){ item.cost = cost; item.shares = shares; }
  list0.push(item);
  const saved = saveCustoms(list0);
  if(!saved || getCustoms().length !== list0.length){
    alert("保存失败：浏览器 localStorage 可能已满。已尝试清理基金缓存，请重试。");
    return;
  }
  $("#cusCode").value = "";
  $("#cusCost").value = "";
  $("#cusShares").value = "";
  refreshCustomList();

  // 异步解析真实名称 + 纠正类型（不阻塞点击；回来后更新名称并刷新）
  // 整体加 2.5s 超时：东财 searchapi/push2 在部分网络下很慢，超时即放弃名称解析（已有代码占位）
  const nameP = Promise.race([
    resolveFundName(code, market, kind),
    new Promise(r=>setTimeout(()=>r(null), 2500))
  ]);
  nameP
    .then(resolved=>{
      if(!resolved) return;
      const inferred = inferKind(resolved);
      let nk = kind, nm = market;
      if(inferred && inferred !== kind){
        nk = inferred;
        nm = (inferred === "etf" ? guessMarket(code) : "");
      }
      const list = getCustoms();
      const t = list.find(x=>x.code===code);
      if(t){
        t.name = resolved;
        t.kind = nk; t.market = nm;
        saveCustoms(list);
        refreshCustomList();
      }
    })
    .catch(()=>{}); // 名称解析失败无所谓，已有代码占位
  } catch(e){
    alert("添加失败：" + (e && e.message ? e.message : e));
  }
}
function removeCustom(code){
  let list = getCustoms().filter(x=>x.code!==code);
  saveCustoms(list);
  refreshCustomList();
}
async function refreshCustomList(){
  try{
  const box = $("#cusList"); box.innerHTML = "";
  // 注：不再 await loadSentiment(current) —— 持仓卡各自走 getSentimentForFund（独立板块恐贪），
  //     开头这步 await 只是为 window.__marketSentiment 兜底（renderOverview 用），与持仓渲染无关；
  //     删掉它可让列表骨架立即渲染，避免"点添加持仓后空等数秒"的假死体感。
  const list = getCustoms();
  if(!list.length){
    box.innerHTML = '<div class="ctitle">我的持仓<small>暂无，请在上方添加</small></div>';
    return;
  }
  const hasPos = list.some(x=>x.cost!=null && x.shares!=null);
  box.innerHTML = '<div class="ctitle">我的持仓<small>共 '+list.length+' 只'+(hasPos?' · 含盈亏与止损止盈线':'')+'</small></div>';

  // 汇总占位（先显示加载中，等数据加载完再填充）
  const summaryHolder = document.createElement("div");
  summaryHolder.innerHTML = '<div class="summary-box"><div class="summary-title">📊 持仓汇总</div><div style="text-align:center;padding:10px;font-size:12px;opacity:.7">加载中…</div></div>';
  box.appendChild(summaryHolder.firstElementChild);

  const holder = document.createElement("div");
  holder.className = "clist";
  box.appendChild(holder);
  // 排序表占位
  const rankHolder = document.createElement("div");

  // 先立即渲染占位卡片（仅本地数据：代码/名称/删除/盈亏框），保证点击添加后瞬间有反馈；
  // 净值、恐贪分、走势图等网络数据回来后逐个替换卡片内容。
  list.forEach((item,i)=>{
    const placeholder = makePlaceholderFund(item);
    const el = cardEl(placeholder);
    el.dataset.idx = i;
    // 删除按钮
    const top = el.querySelector(".fc-top div:first-child");
    top.innerHTML += '<span class="del-btn" data-code="'+item.code+'">删除</span>';
    el.querySelector(".del-btn").onclick = (e)=>{ removeCustom(e.target.dataset.code); };
    // 持仓盈亏框（成本/份额已知即可算，不依赖净值）
    const posHtml = posBoxHtml(item, placeholder, null);
    if(posHtml){
      const wrap = document.createElement("div");
      wrap.innerHTML = posHtml;
      el.appendChild(wrap.firstElementChild);
      el.querySelectorAll(".pos-edit").forEach(btn=>{ btn.onclick = ()=> editPos(item); });
      const ri = el.querySelector(".realized-input");
      if(ri) ri.onchange = ()=> saveRealized(item, ri.value);
    }
    holder.appendChild(el);
  });

  // 异步加载净值+恐贪：只加载一次（v6.5.0 修复——原逻辑会重复调用 loadCustomFund 两遍，
  // 一次替换卡片、一次算汇总，导致持仓每只基金网络请求翻倍）。
  // 现在合并为一次加载，ds/sents 同时供卡片替换与汇总卡复用。
  const ds = list.map(()=>null);
  const sents = list.map(()=>null);
  Promise.all(list.map((item,i)=> loadCustomFund(item).then(d=>({i,d})).catch(()=>({i,d:null}))))
    .then(results=>{
      results.forEach(r=>{ ds[r.i] = r.d; });
      return Promise.all(ds.map((d)=> d ? getSentimentForFund(d.code, d.name).catch(()=>null) : Promise.resolve(null)));
    })
    .then(sentArr=>{
      sentArr.forEach((s,i)=>{ sents[i] = s; });
      // 1) 逐只替换卡片（不阻塞骨架）
      ds.forEach((d,i)=>{
        const item = list[i];
        const fundSent = sents[i];
        const el = holder.querySelector('[data-idx="'+i+'"]');
        if(!el) return;
        const newEl = cardEl(d || makePlaceholderFund(item));
        newEl.dataset.idx = i;
        const top = newEl.querySelector(".fc-top div:first-child");
        top.innerHTML += '<span class="del-btn" data-code="'+item.code+'">删除</span>';
        newEl.querySelector(".del-btn").onclick = (e)=>{ removeCustom(e.target.dataset.code); };
        const secLabel = fundSent && fundSent.sector ? fundSent.sector : (fundSent && fundSent.fallback ? fundSent.fallback : '未归类');
        const secTag = document.createElement("div");
        secTag.className = "sec-tag";
        secTag.innerHTML = '📌 归属板块：<b>'+secLabel+'</b>' + (fundSent && fundSent.score!=null ? '<span class="sec-score">恐贪 '+fundSent.score+'</span>' : '');
        const todayEl = newEl.querySelector(".today");
        if(todayEl && todayEl.parentNode === newEl){ newEl.insertBefore(secTag, todayEl); }
        else { newEl.appendChild(secTag); }
        const posHtml = posBoxHtml(item, d || makePlaceholderFund(item), fundSent);
        if(posHtml){
          const wrap = document.createElement("div");
          wrap.innerHTML = posHtml;
          newEl.appendChild(wrap.firstElementChild);
          newEl.querySelectorAll(".pos-edit").forEach(btn=>{ btn.onclick = ()=> editPos(item); });
          const ri = newEl.querySelector(".realized-input");
          if(ri) ri.onchange = ()=> saveRealized(item, ri.value);
        }
        holder.replaceChild(newEl, el);
      });
      // 2) 填充汇总卡 + 亏损排序表（复用同一批 ds/sents）
      const sumResult = summaryBoxHtml(list, ds);
      const box2 = $("#cusList");
      if(sumResult.summary){
        // v6.5.2：替换汇总卡前，先移除旧的亏损排序表，否则旧表会残留，导致刷新一次多一张表
        const oldRank = box2.querySelector("#rankBox");
        if(oldRank) oldRank.remove();
        const oldSummary = box2.querySelector(".summary-box");
        if(oldSummary) oldSummary.outerHTML = sumResult.summary;
        if(sumResult.rank){
          const newSummary = box2.querySelector(".summary-box");
          if(newSummary) newSummary.insertAdjacentHTML("afterend", sumResult.rank);
        }
        const collapseBtn = box2.querySelector("#rankCollapse");
        const rankBoxEl = box2.querySelector("#rankBox");
        if(collapseBtn && rankBoxEl){
          collapseBtn.onclick = function(){
            if(rankBoxEl.style.display === "none"){ rankBoxEl.style.display = ""; collapseBtn.textContent = "收起 ▾"; }
            else { rankBoxEl.style.display = "none"; collapseBtn.textContent = "展开 ▸"; }
          };
        }
      } else {
        const oldSummary = box2.querySelector(".summary-box");
        if(oldSummary) oldSummary.remove();
        const oldRank = box2.querySelector("#rankBox");
        if(oldRank) oldRank.remove();
      }
    });
  return; // 提前返回，卡片与汇总数据由上面的异步填充

  // ===== 以下为旧的全量 await 逻辑（已弃用，保留以免误删依赖） =====
  holder.innerHTML = "";
  ds.forEach((d,i)=>{
    const el = cardEl(d);
    const item = list[i]; // 原始持仓数据（含 cost/shares/realized）
    const fundSent = sents[i]; // 该基金对应板块的恐贪分
    // 给标题加删除按钮
    const top = el.querySelector(".fc-top div:first-child");
    top.innerHTML += '<span class="del-btn" data-code="'+d.code+'">删除</span>';
    el.querySelector(".del-btn").onclick = (e)=>{ removeCustom(e.target.dataset.code); };
    // 加板块标签（v6.3.5：让用户知道恐贪值/止损止盈来自哪个板块）
    const secLabel = fundSent && fundSent.sector ? fundSent.sector : (fundSent && fundSent.fallback ? fundSent.fallback : '未归类');
    const secTag = document.createElement("div");
    secTag.className = "sec-tag";
    secTag.innerHTML = '📌 归属板块：<b>'+secLabel+'</b>' + (fundSent && fundSent.score!=null ? '<span class="sec-score">恐贪 '+fundSent.score+'</span>' : '');
    const todayEl = el.querySelector(".today");
    if(todayEl && todayEl.parentNode === el){ el.insertBefore(secTag, todayEl); }
    else { el.appendChild(secTag); }
    // 追加持仓盈亏 + 止损止盈框
    const posHtml = posBoxHtml(item, d, fundSent);
    if(posHtml){
      const wrap = document.createElement("div");
      wrap.innerHTML = posHtml;
      el.appendChild(wrap.firstElementChild);
      // 绑定"改成本/份额"和"已实现盈亏"
      el.querySelectorAll(".pos-edit").forEach(btn=>{
        btn.onclick = ()=> editPos(item);
      });
      const ri = el.querySelector(".realized-input");
      if(ri){
        ri.onchange = ()=> saveRealized(item, ri.value);
      }
    }
    holder.appendChild(el);
  });

  // 持仓汇总 + 亏损排序（v6.3.8 / v6.3.3 排序表移到汇总下方 + 收起按钮）
  const sumResult = summaryBoxHtml(list, ds);
  if(sumResult.summary){
    // 替换顶部占位
    const oldSummary = box.querySelector(".summary-box");
    if(oldSummary) oldSummary.outerHTML = sumResult.summary;
    // 排序表插到汇总卡正下方（卡片列表上方）
    if(sumResult.rank){
      const newSummary = box.querySelector(".summary-box");
      if(newSummary) newSummary.insertAdjacentHTML("afterend", sumResult.rank);
    }
    // 绑定"收起/展开"按钮
    const collapseBtn = box.querySelector("#rankCollapse");
    const rankBoxEl = box.querySelector("#rankBox");
    if(collapseBtn && rankBoxEl){
      collapseBtn.onclick = function(){
        if(rankBoxEl.style.display === "none"){
          rankBoxEl.style.display = "";
          collapseBtn.textContent = "收起 ▾";
        } else {
          rankBoxEl.style.display = "none";
          collapseBtn.textContent = "展开 ▸";
        }
      };
    }
  } else {
    // 没有持仓数据（都没填成本份额），移除占位
    const oldSummary = box.querySelector(".summary-box");
    if(oldSummary) oldSummary.remove();
  }
  // 不再做跨板块对比：持仓跨多板块，与"当前板块 Top3"对比无意义
  } catch(e){
    console.error("refreshCustomList error", e);
    const box = $("#cusList");
    if(box) box.innerHTML += '<div style="color:#dc2626;padding:10px">持仓列表渲染异常：'+ (e && e.message ? e.message : e) +'</div>';
  }
}
// 保存已实现盈亏
function saveRealized(item, val){
  const list = getCustoms();
  const idx = list.findIndex(x=>x.code===item.code);
  if(idx<0) return;
  const v = parseFloat(val);
  if(isNaN(v)){ delete list[idx].realized; }
  else { list[idx].realized = v; }
  saveCustoms(list);
  // 局部刷新当前卡片（只刷一个，避免全部重拉数据）
  const allHolders = document.querySelectorAll("#cusList .fcard");
  // 简化：直接调 refreshCustomList（重新拉数据，但用户感知是立刻更新）
  refreshCustomList();
}
// 编辑某只持仓的成本/份额
function editPos(item){
  const cost = prompt("修改成本净值（元/份），留空则清除持仓数据仅作观察", item.cost||"");
  if(cost===null) return;
  const shares = prompt("修改持有份额（份），留空则清除持仓数据仅作观察", item.shares||"");
  if(shares===null) return;
  const list = getCustoms();
  const idx = list.findIndex(x=>x.code===item.code);
  if(idx<0) return;
  if(cost==="" || shares===""){
    delete list[idx].cost; delete list[idx].shares;
  } else {
    const c = parseFloat(cost), s = parseFloat(shares);
    if(isNaN(c)||c<=0||isNaN(s)||s<=0){ alert("请填正数"); return; }
    list[idx].cost = c; list[idx].shares = s;
  }
  saveCustoms(list);
  refreshCustomList();
}

/* ============ 事件 ============ */
$("#refreshBtn").onclick = ()=>{
  if(!$("#custom").classList.contains("hidden")) renderCustom();
  else if($("#overview").classList.contains("hidden")) renderCards();
  else renderOverview();
};
$("#ovBtn").onclick = ()=>{ $("#custom").classList.add("hidden"); renderOverview(); };
$("#cusBtn").onclick = ()=>{ $("#overview").classList.add("hidden"); renderCustom(); };
$("#favBtn").onclick = ()=>{ renderFavs(); $("#mask").classList.add("show"); $("#modal").classList.add("show"); };
$("#closeModal").onclick = ()=>{ $("#mask").classList.remove("show"); $("#modal").classList.remove("show"); };
$("#mask").onclick = ()=>{ $("#mask").classList.remove("show"); $("#modal").classList.remove("show"); };

/* ============ 初始化 ============ */
$("#favCount").textContent = getFavs().length;
renderTabs();
renderCards();
</script>
</body>
