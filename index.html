<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选基助手 · 热门板块 Top3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#f4f6fa; --card:#fff; --ink:#1a1d24; --sub:#6b7280; --line:#eef0f4;
    --blue:#1e40af; --up:#d92b2b; --down:#13a05a; --gold:#f59e0b;
  }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); padding:0 0 84px; max-width:680px; margin:0 auto; }
  .top { position:sticky; top:0; z-index:20; background:#fff; padding:12px 14px 8px; border-bottom:1px solid var(--line); }
  .top h1 { font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .top .sub { font-size:11px; color:var(--sub); margin-top:2px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:8px; }
  .topbar .hint { font-size:12px; color:var(--sub); flex:1 1 auto; min-width:200px; }
  .topbar .btns { display:flex; flex-wrap:nowrap; gap:8px; align-items:center; }
  .refresh { background:var(--blue); color:#fff; border:none; border-radius:18px; padding:6px 14px; font-size:13px; font-weight:600; white-space:nowrap; }
  .favbtn { background:#fff; border:1px solid var(--blue); color:var(--blue); border-radius:18px; padding:6px 14px; font-size:13px; font-weight:600; white-space:nowrap; }
  .ovbtn { background:#fff; border:1px solid var(--blue); color:var(--blue); border-radius:18px; padding:6px 14px; font-size:13px; font-weight:600; white-space:nowrap; }
  .tabs-wrap { position:relative; display:flex; align-items:center; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding:10px 14px 4px; scrollbar-width:none; scroll-behavior:smooth; }
  .tabs::-webkit-scrollbar{display:none;}
  .chip { flex:0 0 auto; padding:7px 14px; border-radius:20px; background:#fff; border:1px solid var(--line);
    font-size:13px; color:var(--sub); white-space:nowrap; cursor:pointer; }
  .chip.on { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:700; }
  .tab-arrow { display:none; flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:1px solid #d1d5db; background:#fff; color:var(--blue); font-size:20px; font-weight:900; align-items:center; justify-content:center; cursor:pointer; z-index:5; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  @media (min-width:640px){
    .tab-arrow { display:flex; }
    .tabs { padding-left:6px; padding-right:6px; margin:0 4px; }
  }
  .sectitle { padding:14px 16px 6px; font-size:15px; font-weight:800; }
  .sectitle small { font-weight:400; color:var(--sub); font-size:11px; margin-left:6px; }
  #cards { padding:4px 12px; display:flex; flex-direction:column; gap:12px; }
  .fcard { background:var(--card); border-radius:14px; padding:14px; box-shadow:0 1px 6px rgba(20,30,60,.05); position:relative; }
  .fc-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .fname { font-size:15px; font-weight:700; line-height:1.3; }
  .fcode { font-size:11px; color:var(--sub); margin-top:2px; }
  .badge { display:inline-block; font-size:10px; padding:1px 7px; border-radius:6px; font-weight:600; margin-right:5px; }
  .b-fund { background:#fef3c7; color:#92400e; }
  .b-etf { background:#dbeafe; color:#1e40af; }
  .star { font-size:20px; color:#d1d5db; cursor:pointer; user-select:none; line-height:1; }
  .star.on { color:var(--gold); }
  .today { display:flex; align-items:baseline; gap:8px; margin:10px 0 4px; }
  .today .pct { font-size:26px; font-weight:800; }
  .today .lbl { font-size:11px; color:var(--sub); }
  .up { color:var(--up); } .down { color:var(--down); }
  .row3 { display:flex; gap:8px; margin-top:8px; }
  .mini { flex:1; background:#f8fafc; border-radius:9px; padding:7px 8px; text-align:center; }
  .mini .k { font-size:10px; color:var(--sub); }
  .mini .v { font-size:14px; font-weight:700; margin-top:2px; }
  .chart { margin-top:10px; }
  .chart svg { width:100%; height:110px; display:block; }
  .legend { font-size:9px; color:var(--sub); display:flex; gap:8px; margin-top:3px; flex-wrap:wrap; }
  .legend i{ display:inline-block; width:11px; height:3px; vertical-align:middle; margin-right:3px; border-radius:2px; }
  .tech { margin-top:10px; border-top:1px dashed var(--line); padding-top:9px; }
  .verdict { display:inline-block; font-size:13px; font-weight:800; padding:3px 12px; border-radius:13px; }
  .verdict.up { background:#fde8e8; color:var(--up); }
  .verdict.down { background:#e7f6ee; color:var(--down); }
  .verdict.neutral { background:#eef1f6; color:#475569; }
  .boss { background:linear-gradient(135deg,#fff7ed,#fef3c7); border:1px solid #fde68a; border-radius:12px; padding:11px 13px; margin:0 12px 10px; }
  .boss .bn { font-size:14px; font-weight:800; color:#92400e; }
  .boss .bf { font-size:11px; color:#b45309; margin-top:3px; }
  .boss .bt { display:inline-block; font-size:10px; background:#f59e0b; color:#fff; padding:1px 7px; border-radius:6px; margin-left:6px; font-weight:600; }
  .boss .bnote { font-size:11px; color:#78350f; margin-top:5px; line-height:1.6; }
  .boss .bret { font-weight:700; }
  .cross { display:inline-block; font-size:11px; font-weight:800; padding:2px 9px; border-radius:11px; margin-left:6px; }
  .cross.gold { background:#fffbeb; color:#b45309; border:1px solid #fcd34d; }
  .cross.dead { background:#ecfdf5; color:#047857; border:1px solid #6ee7b7; }
  .ovbar { position:sticky; top:0; z-index:30; background:#fff; padding:10px 14px; display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line); }
  .ovsec { background:#fff; border-radius:14px; padding:12px 14px; margin:10px 12px; box-shadow:0 1px 6px rgba(20,30,60,.05); }
  .ovhead { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .ovbody { font-size:12px; color:var(--sub); }
  .ovfund { display:inline-block; margin:2px 12px 2px 0; }
  .ovboss { margin-top:6px; font-size:11px; color:#475569; }
  .hidden { display:none !important; }
  .tech .ma { font-size:10px; color:var(--sub); margin:5px 0; }
  .tech .ma b{ color:var(--ink); font-weight:700; }
  .tech .rsn { font-size:11px; color:#566; line-height:1.75; padding-left:2px; margin:0; }
  .tech .rsn li{ list-style:none; }
  .tech .rsn li::before{ content:"· "; color:var(--blue); font-weight:800; }
  .actbox { background:#f8fafc; border-radius:9px; padding:9px 11px; margin:9px 0 4px; }
  .actbox .aline { display:flex; justify-content:space-between; font-size:12px; line-height:1.8; }
  .actbox .aline b { color:var(--ink); min-width:60px; }
  .actbox .aline span { text-align:right; color:#334155; }
  .actbox .score { font-size:11px; color:var(--sub); margin-top:5px; }
  .prices { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:9px 0 7px; }
  .prices .pr { background:#f1f5f9; border-radius:8px; padding:6px 4px; text-align:center; }
  .prices .pr span { display:block; font-size:10px; color:var(--sub); line-height:1.3; }
  .prices .pr b { display:block; font-size:13px; font-weight:800; color:var(--ink); margin-top:2px; }
  .prices .pr.ma5 { background:#fffbeb; }
  .prices .pr.ma5 b { color:#b45309; }
  .prices .pr.ma10 { background:#eff6ff; }
  .prices .pr.ma10 b { color:#1d4ed8; }
  .prices .pr.ma20 { background:#f5f3ff; }
  .prices .pr.ma20 b { color:#6d28d9; }
  .pguide { font-size:11px; line-height:1.7; color:#334155; background:#f8fafc; border:1px dashed #cbd5e1; border-radius:9px; padding:8px 10px; margin-bottom:8px; }
  .pguide.gc { background:#fff7ed; border:1px solid #fed7aa; }
  .pguide.gc b { color:#c2410c; }
  .pguide b { color:var(--ink); font-weight:700; }
  .pguide b.neg { color:var(--down); }

  .verdict { display:inline-block; font-size:13px; font-weight:800; padding:3px 12px; border-radius:13px; }
  .verdict.up { background:#fde8e8; color:var(--up); }
  .verdict.down { background:#e7f6ee; color:var(--down); }
  .verdict.neutral { background:#eef1f6; color:#475569; }
  .tag-chip { display:inline-block; font-size:10px; font-weight:700; padding:1px 8px; border-radius:10px; margin-left:6px; }
  .tag-chip.gold { background:#fffbeb; color:#b45309; border:1px solid #fcd34d; }
  .tag-chip.dead { background:#ecfdf5; color:#047857; border:1px solid #6ee7b7; }
  .tag-chip.pull { background:#eff6ff; color:#1d4ed8; border:1px solid #93c5fd; }
  .tag-chip.break { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
  .loading { text-align:center; color:var(--sub); padding:30px; font-size:13px; }
  .disc { font-size:11px; color:#9aa0aa; padding:14px 18px 4px; line-height:1.6; }
  .disc b { color:#7a8090; }
  /* fav modal */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none; }
  .mask.show { display:block; }
  .modal { position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:680px;
    background:#fff; border-radius:18px 18px 0 0; z-index:50; padding:18px 16px 26px; max-height:78vh; overflow:auto; display:none; }
  .modal.show { display:block; }
  .modal h3 { font-size:16px; margin-bottom:10px; }
  .favitem { display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); }
  .favitem .nm { font-size:13px; font-weight:600; }
  .favitem .cd { font-size:11px; color:var(--sub); }
  .empty { color:var(--sub); font-size:13px; text-align:center; padding:30px 0; }
  .closebtn { float:right; font-size:13px; color:var(--blue); cursor:pointer; }
  /* 自选对比 */
  .cbar { position:sticky; top:0; z-index:30; background:#fff; padding:10px 14px; display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line); }
  .cform { background:#fff; border-radius:14px; padding:14px; margin:10px 12px; box-shadow:0 1px 6px rgba(20,30,60,.05); }
  .cform .row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .cform input { flex:1; min-width:140px; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; }
  .cform select { border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:14px; background:#fff; }
  .cform .hint { font-size:11px; color:var(--sub); margin-top:6px; }
  .clist { padding:4px 12px; display:flex; flex-direction:column; gap:12px; }
  .ctitle { padding:14px 16px 6px; font-size:15px; font-weight:800; }
  .ctitle small { font-weight:400; color:var(--sub); font-size:11px; margin-left:6px; }
  .compare-table { width:100%; border-collapse:collapse; font-size:12px; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 6px rgba(20,30,60,.05); margin:0 12px; max-width:calc(100% - 24px); }
  .compare-table th, .compare-table td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:center; }
  .compare-table th { background:#f8fafc; color:var(--sub); font-weight:600; }
  .compare-table td:first-child, .compare-table th:first-child { text-align:left; }
  .compare-table tr:last-child td { border-bottom:none; }
  .compare-table .fund-name { font-weight:700; font-size:12px; }
  .compare-table .fund-code { font-size:10px; color:var(--sub); }
  .compare-wrap { overflow-x:auto; padding-bottom:10px; }
  .del-btn { font-size:11px; color:#ef4444; margin-left:8px; cursor:pointer; }
  /* ============ 持仓盈亏 & 止损止盈 ============ */
  .pos-box { background:#fff; border-radius:12px; padding:11px 13px; margin:10px 0 0; border:1px solid var(--line); }
  .pos-box.loss { border-color:#fecaca; background:#fef2f2; }
  .pos-box.gain { border-color:#bbf7d0; background:#f0fdf4; }
  .pos-head { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--sub); margin-bottom:6px; }
  .pos-head b { color:var(--ink); }
  .pos-pnl { display:flex; gap:10px; flex-wrap:wrap; }
  .pos-pnl .pi { flex:1; min-width:70px; background:#f8fafc; border-radius:8px; padding:6px 8px; text-align:center; }
  .pos-pnl .pi .k { font-size:10px; color:var(--sub); }
  .pos-pnl .pi .v { font-size:14px; font-weight:800; margin-top:2px; }
  .pos-pnl .pi .v.up { color:var(--up); }
  .pos-pnl .pi .v.down { color:var(--down); }
  .sl-box { background:#fffbeb; border:1px solid #fcd34d; border-radius:10px; padding:9px 11px; margin-top:9px; }
  .sl-box .sl-title { font-size:12px; font-weight:800; color:#b45309; margin-bottom:5px; }
  .sl-box .sl-line { display:flex; justify-content:space-between; font-size:11px; line-height:1.8; color:#78350f; }
  .sl-box .sl-line b { color:#1a1d24; }
  .sl-box .sl-line .sl-stop { color:#dc2626; font-weight:700; }
  .sl-box .sl-line .sl-take { color:#16a34a; font-weight:700; }
  .sl-box .sl-why { font-size:10px; color:#92400e; margin-top:5px; line-height:1.5; background:#fff; border-radius:6px; padding:5px 7px; }
  .pos-input { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; margin-top:5px; }
  .pos-input:focus { outline:none; border-color:var(--blue); }
  .pos-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .pos-fields label { font-size:11px; color:var(--sub); }
  .pos-edit { font-size:11px; color:var(--blue); cursor:pointer; margin-left:8px; }
  /* ============ 持仓汇总 + 亏损排序（v6.3.8）============ */
  .summary-box { background:linear-gradient(135deg,#1e293b,#334155); color:#fff; border-radius:14px; padding:14px; margin:0 12px 12px; box-shadow:0 2px 8px rgba(30,41,59,.15); }
  .summary-box.gain { background:linear-gradient(135deg,#991b1b,#dc2626); }
  .summary-box.loss { background:linear-gradient(135deg,#14532d,#16a34a); }
  .summary-title { font-size:12px; color:rgba(255,255,255,.7); margin-bottom:8px; }
  .summary-pnl { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .summary-pnl .big { font-size:28px; font-weight:800; }
  .summary-pnl .pct { font-size:14px; font-weight:600; opacity:.9; }
  .summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .summary-grid .si { background:rgba(255,255,255,.1); border-radius:8px; padding:6px 4px; text-align:center; }
  .summary-grid .si .k { font-size:9px; color:rgba(255,255,255,.6); }
  .summary-grid .si .v { font-size:12px; font-weight:700; margin-top:2px; }
  .summary-note { font-size:10px; color:rgba(255,255,255,.5); margin-top:8px; }
  /* 亏损排序表 */
  .rank-box { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin:0 12px 12px; }
  .rank-head { font-size:13px; font-weight:800; color:#1e293b; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .rank-head small { font-size:10px; font-weight:400; color:#9ca3af; }
  .rank-item { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-top:1px dashed #eef0f4; font-size:12px; }
  .rank-item:first-of-type { border-top:none; }
  .rank-item .ri-left { flex:1; min-width:0; }
  .rank-item .ri-name { font-weight:600; color:#1e293b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-item .ri-code { font-size:10px; color:#9ca3af; }
  .rank-item .ri-right { text-align:right; flex-shrink:0; margin-left:8px; }
  .rank-item .ri-amt { font-weight:700; font-size:13px; }
  .rank-item .ri-pct { font-size:10px; }
  .rank-item .ri-rank { font-size:10px; color:#9ca3af; width:18px; text-align:center; flex-shrink:0; }
  /* ============ 消息面/情绪面 ============ */
  .sent { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #c7d2fe; border-radius:12px; padding:11px 13px; margin:0 12px 10px; }
  .ov-sent { margin:0 0 10px; }
  .sent-head { font-size:13px; font-weight:800; color:#4338ca; margin-bottom:8px; }
  .thermo { margin-bottom:8px; }
  .th-track { position:relative; height:12px; border-radius:7px; background:linear-gradient(90deg,#16a34a 0%,#eab308 45%,#dc2626 80%,#991b1b 100%); overflow:hidden; opacity:.32; }
  .th-fill { position:absolute; top:0; left:0; height:100%; background:rgba(255,255,255,.0); }
  .th-mark { position:absolute; top:-3px; width:3px; height:18px; background:#1e293b; border-radius:2px; transform:translateX(-50%); }
  .th-meta { display:flex; justify-content:space-between; align-items:baseline; margin-top:5px; }
  .th-score { font-size:15px; font-weight:800; color:#1e293b; }
  .th-label { font-size:12px; font-weight:700; padding:1px 9px; border-radius:6px; }
  .th-label.neutral { background:#e2e8f0; color:#475569; }
  .th-label.greed { background:#dcfce7; color:#15803d; }
  .th-label.greed-ex { background:#16a34a; color:#fff; }
  .th-label.fear { background:#fee2e2; color:#b91c1c; }
  .th-label.fear-ex { background:#dc2626; color:#fff; }
  .sent-row { display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:3px 0; border-top:1px dashed #e0e7ff; }
  .sent-row .sk { color:#6b7280; }
  .sent-row b { font-weight:700; color:#1e293b; }
  .sent-row b.in { color:#d92b2b; }
  .sent-row b.out { color:#13a05a; }
  .sent-row b.muted { color:#9aa0aa; font-weight:600; }
  .sent-row b.north { color:#4338ca; }
  .sent-row .sub { font-size:10px; color:#9aa0aa; margin-left:6px; }
  .sent-note { font-size:11px; color:#6b7280; line-height:1.6; margin-top:6px; background:#fafaff; border-radius:8px; padding:7px 9px; }
  /* ============ 🤖 板块诊断规则引擎 ============ */
  .diag-box { border-radius:12px; padding:12px 13px; margin:0 12px 10px; border:1px solid; }
  .diag-box.sev-good { background:#f0fdf4; border-color:#86efac; }
  .diag-box.sev-warn { background:#fffbeb; border-color:#fcd34d; }
  .diag-box.sev-danger { background:#fef2f2; border-color:#fecaca; }
  .diag-box.sev-neutral { background:#f8fafc; border-color:#e5e7eb; }
  .diag-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .diag-head b { font-size:13px; color:#1e293b; }
  .diag-pattern { font-size:12px; font-weight:700; color:#1e293b; }
  .diag-why { font-size:11px; color:#374151; line-height:1.7; margin-bottom:8px; }
  .diag-line { padding:1px 0; }
  .diag-advice-head { font-size:11px; font-weight:700; color:#1e40af; margin-bottom:4px; }
  .diag-advice { font-size:11px; color:#1e293b; line-height:1.7; background:#fff; border-radius:8px; padding:7px 9px; margin-bottom:6px; }
  .diag-note { font-size:10px; color:#9ca3af; line-height:1.5; }
  /* ============ 📰 板块资讯 ============ */
  .news-box { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:11px 13px; margin:0 12px 10px; }
  .news-head { font-size:13px; font-weight:800; color:#1e293b; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .news-head small { font-size:10px; font-weight:400; color:#9ca3af; }
  .news-item { padding:8px 0; border-top:1px dashed #eef0f4; }
  .news-item:first-of-type { border-top:none; }
  .news-meta { font-size:10px; color:#9ca3af; margin-bottom:3px; }
  .news-title { font-size:13px; font-weight:600; color:#1e293b; line-height:1.4; text-decoration:none; display:block; }
  .news-title:active { color:#1e40af; }
  .news-summary { font-size:11px; color:#6b7280; line-height:1.5; margin-top:3px; }
  .news-link { font-size:10px; color:#1e40af; text-decoration:none; margin-top:3px; display:inline-block; }
  .news-empty { font-size:11px; color:#9ca3af; text-align:center; padding:10px; }
  .news-loading { font-size:11px; color:#9ca3af; text-align:center; padding:10px; }
</style>
</head>
<body>

<div class="top">

];
function matchSector(code, name){
  // 1) 代码命中候选池
  for(const sec of SECTORS){
    if(sec.pool && sec.pool.some(f=>f.code===code)) return sec;
  }
  // 2) 名称关键词匹配
  if(name){
    for(const [kw, secNames] of _SECTOR_KEYWORDS){
      if(new RegExp(kw).test(name)){
        for(const sn of secNames){
          const s = SECTORS.find(x=>x.name===sn);
          if(s) return s;
        }
      }
    }
  }
  return null; // 3) 兜底
}
// 持仓基金的恐贪分（带缓存，key=板块名）
const _fundSentCache = {};
async function getSentimentForFund(code, name){
  const sec = matchSector(code, name);
  if(!sec){
    // 没匹配到板块，用全市场恐贪分兜底（市场广度+北向，不含板块资金）
    const si = sentimentIndex({
      sectorNet: null,
      marketLimitUp: _sentCache.breadth ? _sentCache.breadth.limitUp : null,
      northNet: _sentCache.north ? (_sentCache.north.south + _sentCache.north.north) : null
    });
    return { score: si.score, label: si.label, sector: null, fallback: "全市场兜底" };
  }
  if(_fundSentCache[sec.name]) return _fundSentCache[sec.name];
  const r = await loadSentiment(sec).catch(()=>null);
  if(!r){
    return { score: 50, label: "中性", sector: sec.name, fallback: "数据缺失" };
  }
  const out = { score: r.si.score, label: r.si.label, sector: sec.name, fallback: null };
  _fundSentCache[sec.name] = out;
  return out;
}

/* ============ 接口：JSONP 通用 ============ */
function jsonpGet(url){
  return new Promise((resolve,reject)=>{
    const cb = "jp" + Math.random().toString(36).slice(2,9);
    const s = document.createElement("script");
    s.src = url + (url.includes("?")?"&":"?") + "cb=" + cb;
    window[cb] = (d)=>{ cleanup(); resolve(d); };
    function cleanup(){ delete window[cb]; s.remove(); }
    s.onerror = ()=>{ cleanup(); reject(new Error("net")); };
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ cleanup(); reject(new Error("timeout")); } }, 9000);
  });
}

function getFundQuoteFromTrend(series){
  if(!series || series.length < 2) return null;
  const last = series[series.length-1], prev = series[series.length-2];
  if(!prev.v) return null;
  const date = new Date(last.t).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
  return { pct: (last.v - prev.v) / prev.v, time: date + " 净值涨跌" };
}

/* 多个数据源竞速：谁先返回非空数据就用谁，避免某个接口挂起时拖累整体 */
function firstNonNull(promises){
  return new Promise((resolve)=>{
    let pending = promises.length, settled = false;
    const check = ()=>{ if(!pending && !settled) { settled = true; resolve(null); } };
    promises.forEach(p=>{
      Promise.resolve(p).then(v=>{
        if(!settled && v && v.length >= 30){ settled = true; resolve(v); return; }
        pending--; check();
      }).catch(()=>{ pending--; check(); });
    });
  });
}

  if(_bkSnap) return _bkSnap;
  _bkSnap = {};
  const fsList = ["m:90+t:2", "m:90+t:3"]; // 行业 + 概念
  await Promise.all(fsList.map(async (fs)=>{
    try{
      const url = "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=500&fid=f62&fs=" + fs +
        "&fields=f12,f14,f62,f184,f3";
      const d = await jsonpGet(url);
      const arr = d && d.data && d.data.diff ? (Array.isArray(d.data.diff)?d.data.diff:Object.values(d.data.diff)) : [];
      arr.forEach(it=>{
        if(it.f12 && it.f12.indexOf("BK")===0){
          _bkSnap[it.f12] = {
            net: it.f62 != null ? it.f62 : 0,
            netPct: (it.f184||0)/1000,
            pct: it.f3 != null ? it.f3/100 : 0,
            name: it.f14 || it.f12
          };
        }
      });
    }catch(e){ /* 单个分类失败不影响另一个 */ }
  }));
  return _bkSnap;
}
/* 板块情绪：合并多个 BK 代码（取主力净额合计 + 加权平均涨跌） */
async function getSectorFlow(bks){
  if(!bks || !bks.length) return null;
  if(bks[0] === "HK"){
    // 港股/恒生科技：改用沪深港通南向资金近似
    const nf = await getNorthFlow();
    if(!nf) return null;
    return { hk:true, net:nf.south, netPct:0, pct:0, name:"港股通(南向)", parts:[] };
  }
  if(bks[0] === "BOND"){
    // 可转债/债基：无板块资金，返回 null，界面显示"债基看股债性价比"
    return null;
  }
  const snap = await loadBkSnapshot();
  const valid = bks.map(b=>snap[b]).filter(x=>x);
  if(!valid.length) return null;
  let net = 0, wsum = 0, pctW = 0;
  valid.forEach(v=>{ net += v.net; const w = Math.abs(v.net)||1; wsum += w; pctW += v.pct*w; });
  return {
    code: bks[0], name: valid[0].name,
    net, netPct: valid.reduce((s,v)=>s+v.netPct,0)/valid.length,
    pct: pctW/wsum,
    parts: valid
  };
}

/* 沪深港通资金：dayNetAmtIn 当日净流入（单位：万元）→ 转为元需 ×1e4
   v6.3.1 修复：原代码误乘 1e8（当成亿元→元），实际接口返回单位是万元，
   导致北向显示 8400000.0 亿（真实约 84 亿被放大 1 万倍）。 */
function getNorthFlow(){
  const url = "https://push2.eastmoney.com/api/qt/kamt/get?fields1=f1,f2,f3,f4&fields2=f51,f52,f53,f54,f55,f56,f57,f58";
  return jsonpGet(url).then(d=>{
    const dt = d && d.data;
    if(!dt) return null;
    // 北向资金（外资买A股）：sh2hk=沪股通，sz2hk=深股通
    const north = (Number(dt.sh2hk && dt.sh2hk.dayNetAmtIn)||0) + (Number(dt.sz2hk && dt.sz2hk.dayNetAmtIn)||0);
    // 南向资金（内资买港股）：hk2sh=港股通(沪)，hk2sz=港股通(深)
    const south = (Number(dt.hk2sh && dt.hk2sh.dayNetAmtIn)||0) + (Number(dt.hk2sz && dt.hk2sz.dayNetAmtIn)||0);
    return { south: south*1e4, north: north*1e4, date: (dt.hk2sh&&dt.hk2sh.date2)||"" };
  }).catch(()=>null);
}

/* 恐贪指数合成：0~100，越高越贪婪（偏买）；越低越恐惧（偏卖）
   输入：sectorNet(板块主力净额,元)、marketLimitUp(涨停家数)、northNet(北向净额,元)
   权重：板块资金 50% + 市场广度 30% + 北向 20% */
function sentimentIndex(opts){
  const {sectorNet, marketLimitUp, northNet} = opts;
  // 板块资金：以 ±50亿为满格
  let s1 = 50;
  if(sectorNet != null){
    const v = Math.max(-50e8, Math.min(50e8, sectorNet)) / 50e8; // -1~1
    s1 = 50 + v*25; // 25~75
  } else s1 = 50;
  // 市场广度：涨停家数 0~150 映射 0~100，中位 ~40家=50分
  let s2 = 50;
  if(marketLimitUp != null){
    const v = Math.max(0, Math.min(150, marketLimitUp)) / 150;
    s2 = 20 + v*60; // 20~80
  }
  // 北向：±100亿满格
  let s3 = 50;
  if(northNet != null){
    const v = Math.max(-100e8, Math.min(100e8, northNet)) / 100e8;
    s3 = 50 + v*25;
  }
  const score = Math.round(s1*0.5 + s2*0.3 + s3*0.2);
  let label, cls;
  if(score >= 80){ label="极度贪婪"; cls="greed-ex"; }
  else if(score >= 60){ label="贪婪"; cls="greed"; }
  else if(score >= 45){ label="中性"; cls="neutral"; }
  else if(score >= 25){ label="恐惧"; cls="fear"; }
  else { label="极度恐惧"; cls="fear-ex"; }
  return { score, label, cls };
}

      .then(d=>{

/* ============ 指标计算 ============ */
function calcMetrics(series){
  if(!series || series.length < 2) return null;
  const n = series.length, last = series[n-1].v, now = series[n-1].t;
  function near(tt){ // 找 <= tt 的最近一个值
    let best = series[0].v;
    for(const p of series){ if(p.t <= tt) best = p.v; else break; }
    return best;
  }
  const v1 = near(now - 365*864e5);
  const v3 = near(now - 3*365*864e5);
  let peak = -Infinity, mdd = 0;
  for(const p of series){ if(p.v > peak) peak = p.v; const dd = (p.v - peak)/peak; if(dd < mdd) mdd = dd; }
  return {
    y1: v1 ? last/v1 - 1 : null,
    y3: v3 ? last/v3 - 1 : null,
    mdd: mdd
  };
}

/* ============ 技术研判引擎（激进版：给明确进/出场意见） ============ */
function calcMA(series, n){
  const out = new Array(series.length).fill(null);
  let sum = 0;
  for(let i=0;i<series.length;i++){
    sum += series[i].v;
    if(i>=n) sum -= series[i-n].v;
    if(i>=n-1) out[i] = sum / n;
  }
  return out;
}
function slope(arr, days){
  // 线性回归斜率（日均变化率）
  const n = Math.min(arr.length, days);
  const seg = arr.slice(-n);
  if(seg.some(x=>x==null)) return 0;
  let sx=0, sy=0, sxx=0, sxy=0;
  for(let i=0;i<n;i++){ sx+=i; sy+=seg[i]; sxx+=i*i; sxy+=i*seg[i]; }
  const b = (n*sxy - sx*sy) / (n*sxx - sx*sx);
  return b / seg[0]; // 相对于首日的日变化率
}
function analyzeTech(series){
  if(!series || series.length < 30) return null;
  const v = series.map(p=>p.v);
  const last = v.length-1;
  const ma5 = calcMA(series,5), ma10 = calcMA(series,10), ma20 = calcMA(series,20);
  const close = v[last];
  const m5 = ma5[last], m10 = ma10[last], m20 = ma20[last];
  const pm5 = ma5[last-1], pm10 = ma10[last-1];
  const bias5 = m5 ? (close-m5)/m5 : 0;
  const ma5slope = slope(ma5, 5), ma10slope = slope(ma10, 5), ma20slope = slope(ma20, 10);
  const priceSlope = slope(v, 10);
  const goldCross = goldCrossPoint(series);
  // 均线状态
  const multi = m5>=m10 && m10>=m20;
  const bear = m5<=m10 && m10<=m20;
  const ma5Up = ma5slope > 0.0005;
  const ma5Down = ma5slope < -0.0005;
  // 回踩/突破
  const low3 = Math.min(v[last], v[last-1], v[last-2]);
  const pullback = (low3 <= m5*1.008 && close >= m5 && ma5Up); // 近3日回踩MA5不破
  const high20 = Math.max(...v.slice(-20)), low20 = Math.min(...v.slice(-20));
  const breakHigh = close >= high20 * 0.998;
  const breakLow = close <= low20 * 1.002;
  // 金叉死叉
  const diff = m5 - m10, prevDiff = pm5 - pm10;
  let crossText, crossTag = "";
  if(diff > 0 && prevDiff <= 0){ crossText = "MA5 上穿 MA10 金叉"; crossTag = "金叉"; }
  else if(diff < 0 && prevDiff >= 0){ crossText = "MA5 下穿 MA10 死叉"; crossTag = "死叉"; }
  else if(diff > 0){ crossText = "MA5 在 MA10 上方运行"; crossTag = "多头"; }
  else { crossText = "MA5 在 MA10 下方运行"; crossTag = "空头"; }
  // 阴阳线（近5日）
  const candles = []; for(let i=Math.max(1,last-4); i<=last; i++) candles.push(v[i]>=v[i-1]);
  const upStreak = candles.filter(x=>x).length;
  const downStreak = candles.filter(x=>!x).length;

  // 评分系统（满分 ±10）
  let score = 0;
  const reasons = [];
  // 1. 均线排列与斜率（最高 ±3）
  if(multi && ma5slope>0){ score+=3; reasons.push("均线多头排列且向上发散"); }
  else if(multi){ score+=2; reasons.push("均线多头排列"); }
  else if(bear){ score-=3; reasons.push("均线空头排列"); }
  else { score += (m5>m10)?1:-1; reasons.push(m5>m10?"MA5上穿MA10未形成多头":"MA5下穿MA10未形成空头"); }
  // 2. 价格相对均线位置（最高 ±3）
  if(close > m5 && m5 > m10 && m10 > m20){ score+=2; reasons.push("价在均线上方，强势"); }
  else if(close > m5){ score+=1; reasons.push("收盘价站上 MA5"); }
  else if(close < m20){ score-=2; reasons.push("收盘价跌破 MA20，偏弱"); }
  else if(close < m10){ score-=1; reasons.push("收盘价跌破 MA10"); }
  else if(close < m5){ score-=1; reasons.push("收盘价跌破 MA5"); }
  // 3. 金叉死叉（±2）
  if(crossTag==="金叉"){ score+=2; reasons.push("刚刚金叉，短线转强"); }
  else if(crossTag==="死叉"){ score-=2; reasons.push("刚刚死叉，短线走弱"); }
  else if(crossTag==="多头"){ score+=1; reasons.push("金叉后多头延续"); }
  else { score-=1; reasons.push("死叉后空头延续"); }
  // 4. 回踩与平台突破（±2）
  if(pullback){ score+=2; reasons.push("回踩 MA5 不破，买点附近"); }
  if(breakHigh){ score+=2; reasons.push("创近20日新高，突破有效"); }
  if(breakLow){ score-=2; reasons.push("创近20日新低，跌破平台"); }
  // 5. 乖离率（±2）
  if(bias5 > 0.12){ score-=2; reasons.push("乖离率"+(bias5*100).toFixed(1)+"%，短线过热"); }
  else if(bias5 > 0.05){ score+=1; reasons.push("乖离率健康("+(bias5*100).toFixed(1)+"%)"); }
  else if(bias5 < -0.05){ score+=1; reasons.push("乖离率负向("+(bias5*100).toFixed(1)+"%)，超跌反弹概率升"); }
  // 6. 趋势斜率与连阳（±2）
  if(priceSlope > 0.003){ score+=1; reasons.push("近10日趋势向上"); }
  else if(priceSlope < -0.003){ score-=1; reasons.push("近10日趋势向下"); }
  if(upStreak >= 4){ score+=1; reasons.push("近5日 "+upStreak+" 阳，动能强"); }
  if(downStreak >= 4){ score-=1; reasons.push("近5日 "+downStreak+" 阴，承压"); }

  // 结论映射 + 操盘建议
  let verdict, vcls, action, position, stop;
  if(score >= 5){
    verdict = "积极做多"; vcls = "up";
    action = "可沿 MA5 加仓，创20日新高可追"; position = "激进 50-70% / 稳健 30-50%"; stop = "跌破 MA10 减仓";
  } else if(score >= 3){
    verdict = "轻仓跟进"; vcls = "up";
    action = "回踩 MA5 不破轻仓试多"; position = "激进 30-40% / 稳健 20%"; stop = "跌破 MA20 止损";
  } else if(score >= 1){
    verdict = "中性偏强"; vcls = "neutral";
    action = "已有仓位持有，暂不追高"; position = "持有"; stop = "跌破 MA10 减仓";
  } else if(score >= -1){
    verdict = "中性观望"; vcls = "neutral";
    action = "方向不明，空仓等待"; position = "空仓或≤10%"; stop = "—";
  } else if(score >= -3){
    verdict = "谨慎减仓"; vcls = "down";
    action = "逢高减仓，不抄底"; position = "仓位降至 30% 以下"; stop = "反弹至 MA10 附近减仓";
  } else {
    verdict = "离场观望"; vcls = "down";
    action = "趋势走弱，离场观望"; position = "空仓"; stop = "等 MA5 重新上穿 MA10";
  }
  return {
    close, m5,m10,m20,bias5, ma5slope,ma10slope,ma20slope, priceSlope,
    multi,bear, pullback,breakHigh,breakLow, crossTag, crossText,
    upStreak, downStreak, score, goldCross,
    verdict, vcls, action, position, stop, reasons
  };
}
// 生成"操作价位"解读：把模糊的均线信号翻译成具体数字，方便直接照着操作
function priceGuide(close, t){
  if(close == null || !t) return "";
  const f = x=>(+x).toFixed(3);
  const rel = (a,b)=> (a-b)/b*100; // a 相对 b 的百分比（正=高，负=低）
  const fmt = x => (x<0 ? '<b class="neg">'+x.toFixed(2)+'%</b>' : '<b>'+x.toFixed(2)+'%</b>');
  let parts = [];
  // 1. 跌破 / 站上 MA10（以"现价相对 MA10 偏离"表达，方向统一）
  const d10 = rel(close, t.m10);
  if(d10 < 0) parts.push('现价 <b>'+f(close)+'</b> 已跌破 MA10(<b>'+f(t.m10)+'</b>)，低 '+fmt(d10)+'，按策略减仓/止损');
  else parts.push('现价在 MA10(<b>'+f(t.m10)+'</b>) 上方 '+fmt(d10)+'，MA10 为减仓/止损参考线');
  // 2. 沿 MA5 加仓区（现价≥MA5 时回落至此加仓；已破 MA5 时反弹至此减仓）
  const d5 = rel(close, t.m5);
  if(d5 >= 0) parts.push('MA5 加仓区在 <b>'+f(t.m5)+'</b>，若回落至此约 -'+d5.toFixed(2)+'% 空间');
  else parts.push('现价已破 MA5(<b>'+f(t.m5)+'</b>)，反弹回此约 +'+(-d5).toFixed(2)+'% 为减仓/止盈点');
  // 3. MA20 强支撑（现价相对 MA20 偏离）
  const d20 = rel(close, t.m20);
  if(d20 >= 0) parts.push('MA20 强支撑 <b>'+f(t.m20)+'</b>，现价高于其 '+fmt(d20));
  else parts.push('MA20 强支撑 <b>'+f(t.m20)+'</b>，现价低于其 '+fmt(d20));
  return parts.join('；');
}
/* 金叉临界推算：当前未金叉时，算出"明日净值需达多少、MA5 才上穿 MA10 形成金叉"
   明日MA5=(m5*5 - v[n-5] + X)/5，明日MA10=(m10*10 - v[n-10] + X)/10，令明日MA5>=明日MA10 解出 X */
function goldCrossPoint(series){
  const v = series.map(p=>p.v);
  const n = v.length;
  if(n < 11) return null;
  const ma5 = calcMA(series,5), ma10 = calcMA(series,10);
  const m5 = ma5[n-1], m10 = ma10[n-1];
  if(m5 >= m10) return { crossed:true, m5, m10 };
  const v5ago = v[n-5], v10ago = v[n-10];
  const X = 10*m10 - v10ago - 10*m5 + 2*v5ago;
  return { crossed:false, price:X, m5, m10 };
}
function drawChart(series, w=300, h=110){
  if(!series || series.length < 2) return "";
  const N = Math.min(series.length, 55);
  const idx0 = series.length - N;
  const seg = series.slice(idx0);
  const ma5 = calcMA(series,5).slice(idx0), ma10 = calcMA(series,10).slice(idx0), ma20 = calcMA(series,20).slice(idx0);
  const vals = seg.map(p=>p.v);
  let lo=Infinity, hi=-Infinity;
  [vals,ma5,ma10,ma20].forEach(arr=>arr.forEach(x=>{ if(x!=null){ if(x<lo)lo=x; if(x>hi)hi=x; } }));
  const span=(hi-lo)||1;
  const axisH = 18; // 底部留给 X 轴标签
  const plotH = h - axisH;
  const step=w/(N-1);
  function path(arr){
    const pts=[];
    arr.forEach((x,i)=>{ if(x==null)return; pts.push([i*step, plotH-(x-lo)/span*(plotH-12)-6]); });
    return pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  }
  const up = vals[N-1] >= vals[0];
  const cMain = up ? "#d92b2b" : "#13a05a";
  const area = path(vals) + " L"+w+" "+plotH+" L0 "+plotH+" Z";
  // 日期标签：起点、中点、终点（只显示月份，避免拥挤）
  function fmtM(t){ const d=new Date(t); return (d.getMonth()+1)+"月"; }
  const labStart = fmtM(seg[0].t), labMid = fmtM(seg[Math.floor(N/2)].t), labEnd = fmtM(seg[N-1].t);
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
    '<path d="'+area+'" fill="'+cMain+'" opacity="0.07"/>' +
    '<path d="'+path(ma20)+'" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.85"/>' +
    '<path d="'+path(ma10)+'" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.85"/>' +
    '<path d="'+path(ma5)+'" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>' +
    '<path d="'+path(vals)+'" fill="none" stroke="'+cMain+'" stroke-width="1.8"/>' +
    '<text x="4" y="'+(h-4)+'" font-size="10" fill="#6b7280">'+labStart+'</text>' +
    '<text x="'+(w/2)+'" y="'+(h-4)+'" text-anchor="middle" font-size="10" fill="#6b7280">'+labMid+'</text>' +
    '<text x="'+(w-4)+'" y="'+(h-4)+'" text-anchor="end" font-size="10" fill="#6b7280">'+labEnd+'</text>' +
    '</svg>';
}

/* ============ 走势图 SVG ============ */
function sparkline(series, w=300, h=56){
  if(!series || series.length < 2) return "";
  const vals = series.slice(-30).map(p=>p.v);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max-min)||1;
  const step = w/(vals.length-1);
  const pts = vals.map((v,i)=>[i*step, h - (v-min)/span*(h-8) - 4]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const up = vals[vals.length-1] >= vals[0];
  const color = up ? "#d92b2b" : "#13a05a";
  const area = line + " L"+w+" "+h+" L0 "+h+" Z";
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
    '<path d="'+area+'" fill="'+color+'" opacity="0.08"/>' +
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.6"/>' +
    '</svg>';
}

/* ============ 加载单只基金 ============
   策略：历史净值/K线是最稳定的底牌；实时行情只是"锦上添花"。
   这样即使 push2 被网络拦截，也能显示走势图、近1年/3年、技术面研判。 */
async function loadFund(f){
  let quote = null, series = null;
  const secid = (f.market==="sh"?"1":"0") + "." + f.code;

  if(f.kind === "fund"){
    // 场外基金：pingzhongdata + 新浪净值 + push2his K线，三通道竞速取第一个可用
    series = await firstNonNull([
      getFundTrend(f.code).catch(()=>null),
      getFundTrendSina(f.code).catch(()=>null),
      getKline("0." + f.code).catch(()=>null)
    ]);
    quote = getFundQuoteFromTrend(series); // 用最后两日净值算涨跌
  } else {
    // 场内 ETF：push2his K线 + 新浪净值 竞速，同时拉 push2 实时行情
    const qPromise = getEtfQuote(secid).catch(()=>null);
    series = await firstNonNull([
      getKline(secid).catch(()=>null),
      getFundTrendSina(f.code).catch(()=>null)
    ]);
    const q = await qPromise;
    if(q && q.pct != null){
      quote = q; // 盘中行情
    } else if(series && series.length >= 2){
      quote = getFundQuoteFromTrend(series);
    }
  }

  const m = calcMetrics(series);
  const tech = analyzeTech(series);
  return Object.assign({}, f, { quote, series, m, tech });
}

/* ============ v6：候选池实时重排，取当前最强 Top3 ============ */
// 综合分：近1年为主(60%)、近3年(40%)，最大回撤>30%额外惩罚；全为空返回极小值
function scoreOf(d){
  if(!d || !d.m || d.m.y1==null) return -1e9;
  const y1 = d.m.y1||0, y3 = d.m.y3||0, mdd = d.m.mdd||0;
  const retScore = y1*0.6 + y3*0.4;
  const riskPenalty = Math.max(0, -mdd - 0.3);
  return retScore*100 - riskPenalty*40;
}
// 拉取候选池全部基金净值，算指标，按综合分降序，返回前3
async function rankPool(sec){
  const pool = sec.pool || [];
  const loaded = [];
  const BATCH = 4; // 限制并发，避免请求覆盖/卡死
  for(let i=0;i<pool.length;i+=BATCH){
    const batch = pool.slice(i,i+BATCH);
    const ds = await Promise.all(batch.map(f=>loadFund(f).catch(()=>null)));
    ds.forEach(d=>{ if(d && d.series && d.series.length>=30) loaded.push(d); });
  }
  loaded.sort((a,b)=> scoreOf(b) - scoreOf(a));
  loaded.forEach((d,idx)=> d._rank = idx+1);
  return loaded.slice(0,3);
}

/* ============ 消息面/情绪面渲染块 ============ */
/* ============ 🤖 板块诊断规则引擎（v6.3.5）============
   把"为什么弱/强"的常见模式做成规则，基于已有信号（恐贪/资金/技术面/收益）自动诊断。
   不是真 AI（纯前端做不了），是预设模式匹配 + 结构化解读，覆盖 80% 常见场景。
   输入：sec(板块)、sent(情绪数据)、top(Top3基金数组，取平均技术面)
   输出：{ title, pattern, why[], advice[], severity } */
function sectorDiagnose(sec, sent, top){
  if(!sent) return null;
  const si = sent.si;
  const flow = sent.flow;
  const flowYi = flow ? flow.net/1e8 : 0;          // 板块主力净额（亿）
  const flowPct = flow ? (flow.netPct||0) : 0;     // 占成交额比
  const isOutflow = flowYi < -1;                    // 净流出超1亿
  const bigOutflow = flowYi < -5;                   // 大幅净流出超5亿
  // Top3 平均技术面分
  let avgScore = 0, techCnt = 0, hasDeath = false, hasBreak = false;
  if(top && top.length){
    top.forEach(d=>{
      if(d.tech){ avgScore += d.tech.score; techCnt++; if(d.tech.crossTag==="死叉") hasDeath=true; }
      if(d.m && d.m.mdd!=null && d.m.mdd < -0.2) hasBreak = true;
    });
    if(techCnt) avgScore = avgScore / techCnt;
  }
  // 近1年收益（取Top1）
  const y1 = (top && top[0] && top[0].m && top[0].m.y1!=null) ? top[0].m.y1 : null;
  const y1Neg = (y1 != null && y1 < 0);

  const why = [], advice = [];
  let pattern = "", severity = "neutral"; // neutral/warn/danger/good

  // 规则1：资金撤离型（恐贪贪婪 + 主力净流出 + 技术弱）—— 你绿电那种
  if(si.score >= 55 && isOutflow && avgScore < 2){
    pattern = "资金撤离型走弱";
    severity = "warn";
    why.push("恐贪"+si.score+"贪婪档 + 板块主力净流出"+Math.abs(flowYi).toFixed(1)+"亿——大盘回暖，避险资金从防御板块撤离去追科技主线");
    why.push("Top3平均技术面分"+avgScore.toFixed(1)+"（<2偏弱），趋势未转强");
    advice.push("分批减仓：先减1/3~1/2，留部分等反弹，不要一把割");
    advice.push("等恐贪回落到恐惧档(<45)或技术面分≥3再分批接回");
  }
  // 规则2：业绩真空型（利好板块+净流出+收益正但近期走弱）
  else if(isOutflow && avgScore < 1 && !y1Neg && si.score >= 45){
    pattern = "业绩真空期走弱";
    severity = "warn";
    why.push("板块主力净流出"+Math.abs(flowYi).toFixed(1)+"亿，但近1年仍+"+(y1*100).toFixed(1)+"%——政策利好已落地但业绩兑现要等，资金回避真空期");
    why.push("市场当下只炒'能兑现业绩'的，远期政策短期不定价");
    advice.push("等业绩公告窗口（季报/年报）或切换下一年预期时再配置");
    advice.push("短线不必死扛，可减仓等催化，长线逻辑未改");
  }
  // 规3：基本面承压型（净流出 + 近1年负 + 消纳/周期类）
  else if(bigOutflow && y1Neg){
    pattern = "基本面承压型走弱";
    severity = "danger";
    why.push("板块主力大幅净流出"+Math.abs(flowYi).toFixed(1)+"亿 + 近1年"+(y1*100).toFixed(1)+"%——行业基本面尚未见拐点（如消纳压力/产能过剩/电价压制）");
    why.push("机构共识：等基本面拐点或切换下年预期才是配置时点");
    advice.push("严格执行止损，不抄底");
    advice.push("等板块主力资金连续3日净流入 + 恐贪<35 恐惧档再考虑分批建仓");
  }
  // 规则4：趋势破位型（技术面死叉/跌破）
  else if(hasDeath && avgScore < -1){
    pattern = "技术趋势破位";
    severity = "danger";
    why.push("Top3出现死叉 + 平均技术面分"+avgScore.toFixed(1)+"——短线趋势走弱，MA5下穿MA10");
    advice.push("跌破MA10减仓，跌破MA20止损");
    advice.push("等金叉信号或站稳MA10再回补");
  }
  // 规则5：恐慌见底型（恐贪极度恐惧 + 净流出放缓）
  else if(si.score < 30 && !bigOutflow){
    pattern = "恐慌接近见底";
    severity = "good";
    why.push("恐贪"+si.score+"极度恐惧档 + 主力流出未放大——市场恐慌抛售接近尾声，逆向机会显现");
    advice.push("可分批建仓：首批30-40%试探，金叉后加仓，突破补足");
    advice.push("但底部可能反复，严格设止损（-5%~-8%）");
  }
  // 规则6：强势主线型（恐贪贪婪 + 净流入 + 技术强）
  else if(si.score >= 60 && flowYi > 2 && avgScore >= 3){
    pattern = "强势主线型";
    severity = "good";
    why.push("恐贪"+si.score+"贪婪档 + 板块主力净流入"+flowYi.toFixed(1)+"亿 + Top3技术面分"+avgScore.toFixed(1)+"——资金+情绪+技术共振，当前主线");
    advice.push("可沿MA5轻仓跟进，创20日新高可追");
    advice.push("但恐贪已贪婪，注意乖离率>12%短线过热信号，设好止损");
  }
  // 规则7：中性观望（没明显模式）
  else {
    pattern = "方向不明·观望";
    severity = "neutral";
    why.push("恐贪"+si.score+si.label+" + 主力"+(flowYi>=0?"净流入":"净流出")+Math.abs(flowYi).toFixed(1)+"亿 + 技术面分"+avgScore.toFixed(1)+"——信号矛盾，无明显趋势");
    advice.push("空仓或≤10%观察，等信号明确");
    advice.push("触发条件：恐贪<35恐惧档 或 技术面分≥3 + 金叉");
  }

  return { title:"🤖 板块诊断", pattern, severity, why, advice,
    metrics: { si:si.score, flowYi, avgScore:avgScore.toFixed(1), y1 } };
}

/* ============ 持仓盈亏 & 止损止盈算法（v6.3.1 新增）============ */
// 取最新净值：从 series 末尾取 v
function latestNav(d){
  if(d && d.series && d.series.length) return d.series[d.series.length-1].v;
  return null;
}
// 判断板块属性：防御/成长/周期/平衡（按基金名关键词）
function fundStyle(name){
  if(!name) return "balance";
  const n = name;
  if(/电力|电网|公用|绿电|水务|燃气|公路|铁路|港口|机场|银行|红利|高股息|债|纯债|利率|央企现代能源/.test(n)) return "defend";
  if(/半导体|芯片|科技|信息|人工智能|AI|军工|航天|国防|新能源|光伏|锂电|电池|创新药|生物|医药|计算机|传媒|游戏|机器人/.test(n)) return "growth";
  if(/有色|黄金|白银|煤炭|钢铁|证券|保险|地产|建材|化工|石油|资源|稀有/.test(n)) return "cycle";
  return "balance";
}
// 各属性基础止损/止盈比例
const SL_PROFILE = {
  defend:  { stop:0.08, take:0.12, label:"防御·低波动" },
  growth:  { stop:0.12, take:0.25, label:"成长·高弹性" },
  cycle:   { stop:0.15, take:0.30, label:"周期·强波动" },
  balance: { stop:0.10, take:0.18, label:"平衡·默认" }
};
// 计算止损止盈线：结合恐贪分调整
// 恐贪来源：window.__marketSentiment（renderOverview 算的全市场分）；没有则 50 中性
function calcStopTake(cost, style, sentimentScore){
  const p = SL_PROFILE[style] || SL_PROFILE.balance;
  let stopRate = p.stop, takeRate = p.take;
  const s = (sentimentScore!=null) ? sentimentScore : (window.__marketSentiment||50);
  // 恐惧档（<45）：止损放宽 3%（别割在低位），止盈上调 5%（多拿等反弹）
  if(s < 45){ stopRate += 0.03; takeRate += 0.05; }
  // 贪婪档（>=60）：止损收紧 2%（保利润），止盈下调 5%（早落袋）
  else if(s >= 60){ stopRate -= 0.02; takeRate -= 0.05; }
  // 极度贪婪（>=80）：再收紧 2%
  if(s >= 80){ stopRate -= 0.02; }
  stopRate = Math.max(0.04, Math.min(0.20, stopRate));
  takeRate = Math.max(0.08, Math.min(0.40, takeRate));
  const stopPrice = cost * (1 - stopRate);
  const takePrice = cost * (1 + takeRate);
  const reasons = [];
  reasons.push(p.label);
  if(s < 45) reasons.push("恐贪"+s+"恐惧档→止损放宽3%/止盈+5%（避免割在低位）");
  else if(s >= 80) reasons.push("恐贪"+s+"极度贪婪→止损再收紧2%（保利润）");
  else if(s >= 60) reasons.push("恐贪"+s+"贪婪档→止损收紧2%/止盈-5%（早落袋）");
  else reasons.push("恐贪"+s+"中性档→用基础比例");
  return { stopRate, takeRate, stopPrice, takePrice, styleLabel:p.label, reasons };
}

/* ============ 止损后回本路径规划（v6.3.4 新增）============
   分三块：① 再进场信号 ② 分批买入计划 ③ 回本时间测算 */

// ① 再进场信号：满足2个以上可分批进场
// 信号：A.恐贪<45(恐惧档逆向机会) B.技术score>=3(转强) C.金叉或多头 D.站上MA10
function calcRebuySignals(d, fundSent){
  if(!d || !d.tech) return { signals:[], count:0, canRebuy:false };
  const t = d.tech;
  const sentScore = (fundSent && fundSent.score!=null) ? fundSent.score : 50;
  const signals = [];
  if(sentScore < 45) signals.push({ key:"A", name:"恐贪"+sentScore+"恐惧档", desc:"市场恐慌，逆向机会" });
  if(t.score >= 3) signals.push({ key:"B", name:"技术面分"+t.score, desc:"轻仓跟进以上，趋势转强" });
  if(t.crossTag === "金叉") signals.push({ key:"C", name:"MA5金叉MA10", desc:"短线转强信号" });
  else if(t.crossTag === "多头") signals.push({ key:"C", name:"金叉后多头延续", desc:"MA5在MA10上方运行" });
  if(t.close != null && t.m10 != null && t.close > t.m10) signals.push({ key:"D", name:"站上MA10", desc:"净值站稳10日线" });
  return { signals, count:signals.length, canRebuy: signals.length >= 2 };
}

// ② 分批买入计划：基于原投入本金的比例，分3批
// 恐惧档(<45)：首批40% / 确认30% / 突破30%
// 中性档(45-60)：首批30% / 确认40% / 突破30%
// 贪婪档(>=60)：不建议进场，等回调
function calcRebuyPlan(costValue, fundSent){
  const s = (fundSent && fundSent.score!=null) ? fundSent.score : 50;
  if(s >= 60) return { advise:"贪婪档不建议进场，等恐贪回落到中性或恐惧档再分批建仓", batches:[] };
  let p1, p2, p3;
  if(s < 45){ p1=0.40; p2=0.30; p3=0.30; }
  else { p1=0.30; p2=0.40; p3=0.30; }
  const batches = [
    { phase:"首批·试探", pct:p1, amount: costValue*p1, trigger:"再进场信号≥2个" },
    { phase:"二批·确认", pct:p2, amount: costValue*p2, trigger:"净值站稳MA5或金叉后多头延续" },
    { phase:"三批·突破", pct:p3, amount: costValue*p3, trigger:"创近20日新高或恐贪回升到中性" }
  ];
  return { advise:"分3批建仓，首批试探、确认加仓、突破补足，避免一把梭", batches };
}

// ③ 回本路径测算
// 假设止损时剩余份额按止损价卖出 → 实现止损亏损
// 总亏损 = 已实现盈亏(realized) + 止损实现亏损
// 回本需涨% = 总亏损率 / (1 - 总亏损率)
// 按板块近1年年化估乐观/中性/悲观三档月数
function calcRecoveryPath(item, d, sl, realized){
  if(!item.cost || !item.shares || !sl) return null;
  const cost = item.cost, shares = item.shares;
  const costValue = cost * shares;           // 剩余部分投入本金
  // 止损实现亏损 = (止损价 - 成本) × 份额（负数=亏损）
  const stopLoss = (sl.stopPrice - cost) * shares;
  // 总亏损 = 已实现 + 止损实现（realized 可能是之前买卖的，stopLoss 是这次止损的）
  const totalLoss = (realized||0) + stopLoss;
  const lossRate = totalLoss / costValue;    // 总亏损比例（负数）
  const absLossRate = Math.abs(lossRate);
  // 回本需涨%：亏X%要涨 X/(1-X)% 回本
  const needGain = absLossRate / (1 - absLossRate);
  // 板块历史年化（用近1年收益 d.m.y1）
  const y1 = (d && d.m && d.m.y1!=null) ? d.m.y1 : 0.10; // 默认10%
  const y3 = (d && d.m && d.m.y3!=null) ? d.m.y3 : 0.08;
  const avgAnnual = (y1 + y3) / 2;
  // 三档预估：乐观×1.3 / 中性×0.8 / 悲观×0.3（悲观可能为负=持续亏）
  const optAnnual = avgAnnual * 1.3;
  const neuAnnual = avgAnnual * 0.8;
  const pesAnnual = avgAnnual * 0.3;
  const estMonths = (annual) => {
    if(annual <= 0) return null; // 负年化=无法回本
    return Math.ceil(needGain / annual * 12);
  };
  return {
    stopLoss, totalLoss, lossRate, absLossRate, needGain,
    avgAnnual,
    optimistic: { annual: optAnnual, months: estMonths(optAnnual) },
    neutral:    { annual: neuAnnual, months: estMonths(neuAnnual) },
    pessimistic:{ annual: pesAnnual, months: estMonths(pesAnnual) }
  };
}

/* ============ 持仓汇总 + 亏损排序（v6.3.8）============
   输入：list(原始持仓)、ds(加载后的基金数据)
   汇总：今日总盈亏、总市值、总投入、总浮动盈亏、总盈亏(含已实现)
   排序：按总盈亏率从低到高（亏得多的排前面），只显示基金名+亏损金额+比例 */
function summaryBoxHtml(list, ds){
  let totalCost = 0, totalValue = 0, totalRealized = 0, todayPnl = 0;
  const items = []; // {name,code,amt,pct,realized,todayPnl}
  list.forEach((item, i)=>{
    const d = ds[i];
    if(!d) return;
    const nav = latestNav(d);
    const todayPct = (d.quote && d.quote.pct!=null) ? d.quote.pct : 0;
    if(item.cost!=null && item.shares!=null && nav!=null){
      const costVal = item.cost * item.shares;
      const nowVal = nav * item.shares;
      const pnl = nowVal - costVal;
      const realized = (item.realized!=null && !isNaN(parseFloat(item.realized))) ? parseFloat(item.realized) : 0;
      const totalPnl = pnl + realized;
      const totalPnlRate = costVal>0 ? totalPnl/costVal : 0;
      // 今日盈亏 = 昨日市值 × 今日涨跌幅 ≈ (nowVal/(1+todayPct)) × todayPct
      const yestVal = todayPct!=0 ? nowVal/(1+todayPct) : nowVal;
      const dayPnl = yestVal * todayPct;
      totalCost += costVal;
      totalValue += nowVal;
      totalRealized += realized;
      todayPnl += dayPnl;
      items.push({
        name: d.name || item.code, code: item.code,
        costVal, nowVal, pnl, realized, totalPnl, totalPnlRate,
        todayPct, dayPnl
      });
    }
  });
  if(!items.length) return { summary:null, rank:null };
  const totalPnlAll = (totalValue - totalCost) + totalRealized;
  const totalPnlRate = totalCost>0 ? totalPnlAll/totalCost : 0;
  const fmt = (x)=> Math.abs(x)>=10000 ? (x/10000).toFixed(2)+"万" : x.toFixed(2);
  const todayPct = totalValue>0 ? todayPnl/(totalValue - todayPnl) : 0;
  // 汇总卡
  const summaryCls = totalPnlAll >= 0 ? "gain" : "loss";
  const summary =
    '<div class="summary-box '+summaryCls+'">' +
      '<div class="summary-title">📊 持仓汇总 · 共 '+items.length+' 只</div>' +
      '<div class="summary-pnl">' +
        '<span class="big">'+(totalPnlAll>=0?"+":"-")+fmt(Math.abs(totalPnlAll))+'</span>' +
        '<span class="pct">'+(totalPnlRate*100>=0?"+":"")+(totalPnlRate*100).toFixed(2)+'%</span>' +
      '</div>' +
      '<div class="summary-grid">' +
        '<div class="si"><span class="k">总投入</span><div class="v">'+fmt(totalCost)+'</div></div>' +
        '<div class="si"><span class="k">总市值</span><div class="v">'+fmt(totalValue)+'</div></div>' +
        '<div class="si"><span class="k">今日盈亏</span><div class="v">'+(todayPnl>=0?"+":"-")+fmt(Math.abs(todayPnl))+'</div></div>' +
        '<div class="si"><span class="k">已实现</span><div class="v">'+(totalRealized>=0?"+":"-")+fmt(Math.abs(totalRealized))+'</div></div>' +
      '</div>' +
      '<div class="summary-note">总盈亏 = (总市值-总投入) + 已实现盈亏 · 今日盈亏按今日涨跌幅×昨日市值估算</div>' +
    '</div>';
  // 亏损排序：按总盈亏率从低到高（亏得多的排前面）
  items.sort((a,b)=> a.totalPnlRate - b.totalPnlRate);
  let rankHtml = '<div class="rank-box">';
  rankHtml += '<div class="rank-head">📉 亏损程度排序 <small>从亏得多到亏得少（或赚）</small></div>';
  items.forEach((it, idx)=>{
    const cls_ = it.totalPnl >= 0 ? "up" : "down";
    rankHtml += '<div class="rank-item">';
    rankHtml += '<div class="ri-rank">'+(idx+1)+'</div>';
    rankHtml += '<div class="ri-left"><div class="ri-name">'+it.name+'</div><div class="ri-code">'+it.code+' · 今日 '+(it.todayPct*100>=0?"+":"")+(it.todayPct*100).toFixed(2)+'%</div></div>';
    rankHtml += '<div class="ri-right"><div class="ri-amt '+cls_+'">'+(it.totalPnl>=0?"+":"-")+fmt(Math.abs(it.totalPnl))+'</div><div class="ri-pct '+cls_+'">'+(it.totalPnlRate*100>=0?"+":"")+(it.totalPnlRate*100).toFixed(2)+'%</div></div>';
    rankHtml += '</div>';
  });
  rankHtml += '</div>';
  return { summary, rank:rankHtml };
}

// 渲染单只持仓的盈亏 + 止损止盈框
// 已实现盈亏（item.realized，元）由用户手动填写——表示之前买卖已落袋的部分
// 总盈亏 = 浮动盈亏 + 已实现盈亏
// fundSent：该持仓基金对应板块的恐贪分 {score,label,sector,fallback}（v6.3.3：每只用自己板块的，不再共用当前 tab）
function posBoxHtml(item, d, fundSent){
  if(item.cost==null || item.shares==null) return "";
  const nav = latestNav(d);
  if(nav==null) return '<div class="pos-box"><div class="pos-head">净值未取到，暂无法算盈亏</div></div>';
  const cost = item.cost, shares = item.shares;
  const costValue = cost * shares;          // 投入本金
  const nowValue = nav * shares;            // 当前市值
  const pnl = nowValue - costValue;         // 浮动盈亏金额
  const pnlRate = (nav - cost) / cost;      // 浮动盈亏比例
  const realized = (item.realized!=null && !isNaN(parseFloat(item.realized))) ? parseFloat(item.realized) : 0;
  const totalPnl = pnl + realized;          // 总盈亏 = 浮动 + 已实现
  const cls_ = totalPnl >= 0 ? "gain" : "loss";
  const pnlCls = pnl >= 0 ? "up" : "down";
  const totalCls = totalPnl >= 0 ? "up" : "down";
  const style = fundStyle(d.name);
  const sentScore = (fundSent && fundSent.score!=null) ? fundSent.score : 50;
  const sl = calcStopTake(cost, style, sentScore);
  // 离止损线还有多远（相对当前净值）
  const distStop = (nav - sl.stopPrice) / nav;
  const distTake = (sl.takePrice - nav) / nav;
  const stopBroke = nav <= sl.stopPrice;
  const takeHit = nav >= sl.takePrice;
  let alertTxt = "";
  if(stopBroke) alertTxt = "⚠️ 当前净值已跌破止损线，建议减仓止损";
  else if(takeHit) alertTxt = "✅ 当前净值已达止盈线，建议分批止盈";
  else if(distStop < 0.02) alertTxt = "⚠️ 距止损线不足2%，密切关注";
  const fmt = (x)=> Math.abs(x)>=10000 ? (x/10000).toFixed(2)+"万" : x.toFixed(2);
  // 恐贪来源说明
  const sentTag = fundSent
    ? (fundSent.sector ? '板块：'+fundSent.sector+' · 恐贪 '+fundSent.score+' '+fundSent.label : (fundSent.fallback||'全市场')+' · 恐贪 '+fundSent.score+' '+fundSent.label)
    : '恐贪 50 中性';
  let html = '<div class="pos-box '+cls_+'">';
  html += '<div class="pos-head"><span><b>持仓盈亏</b> · '+sl.styleLabel+'</span><span class="pos-edit" data-code="'+item.code+'">✎ 改成本/份额</span></div>';
  html += '<div class="pos-pnl">';
  html += '<div class="pi"><span class="k">当前净值</span><div class="v">'+nav.toFixed(4)+'</div></div>';
  html += '<div class="pi"><span class="k">当前市值</span><div class="v">'+fmt(nowValue)+'</div></div>';
  html += '<div class="pi"><span class="k">浮动盈亏</span><div class="v '+pnlCls+'">'+(pnl>=0?"+":"-")+fmt(Math.abs(pnl))+'</div></div>';
  html += '<div class="pi"><span class="k">浮动盈亏率</span><div class="v '+pnlCls+'">'+(pnlRate*100>=0?"+":"")+(pnlRate*100).toFixed(2)+'%</div></div>';
  html += '</div>';
  // 已实现盈亏输入行
  html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-top:8px;padding-top:7px;border-top:1px dashed #e5e7eb">';
  html += '<span style="color:var(--sub)">已实现盈亏（元）·<span style="font-size:10px">之前买卖已落袋</span></span>';
  html += '<input type="number" class="realized-input pos-input" data-code="'+item.code+'" value="'+(item.realized!=null?item.realized:'')+'" placeholder="如 -1500（亏损）或 +800（盈利），0/留空=无" step="0.01" style="width:160px;margin-top:0;text-align:right">';
  html += '</div>';
  // 总盈亏汇总
  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding:7px 9px;background:#f8fafc;border-radius:8px">';
  html += '<span style="font-size:12px;font-weight:700;color:var(--ink)">总盈亏（浮动+已实现）</span>';
  html += '<span class="'+totalCls+'" style="font-size:16px;font-weight:800">'+(totalPnl>=0?"+":"-")+fmt(Math.abs(totalPnl))+'</span>';
  html += '</div>';
  html += '<div class="sl-box">';
  html += '<div class="sl-title">📐 建议止损/止盈线 · <span style="font-size:10px;font-weight:600;color:#92400e">'+sentTag+'</span></div>';
  html += '<div class="sl-line"><span>止损价 <b class="sl-stop">'+sl.stopPrice.toFixed(4)+'</b>（-'+(sl.stopRate*100).toFixed(1)+'%）</span><span style="font-size:10px;color:#92400e">'+(stopBroke?'<b style="color:#dc2626">已跌破</b>':('距当前 '+(-distStop*100).toFixed(1)+'%'))+'</span></div>';
  html += '<div class="sl-line"><span>止盈价 <b class="sl-take">'+sl.takePrice.toFixed(4)+'</b>（+'+(sl.takeRate*100).toFixed(1)+'%）</span><span style="font-size:10px;color:#92400e">'+(takeHit?'<b style="color:#16a34a">已达标</b>':('距当前 +'+(distTake*100).toFixed(1)+'%'))+'</span></div>';
  html += '<div class="sl-why">'+sl.reasons.join('；')+'。止损/止盈为量化参考，非投资建议，需结合自身风险承受力。</div>';
  if(alertTxt) html += '<div class="sl-why" style="background:#fef2f2;color:#b91c1c;font-weight:700">'+alertTxt+'</div>';
  html += '</div>';

  // ====== 🔄 止损后回本路径规划（v6.3.4）======
  const rebuy = calcRebuySignals(d, fundSent);
  const plan = calcRebuyPlan(costValue, fundSent);
  const rec = calcRecoveryPath(item, d, sl, realized);

  html += '<div class="sl-title" style="color:#1d4ed8">🔄 止损后回本路径规划</div>';

  html += '<div class="sl-line" style="margin-top:4px"><span style="font-weight:700;color:#1e293b">① 什么时候买回来？</span></div>';
  if(rebuy.signals.length === 0){
    html += '<div class="sl-why" style="background:#fff">当前无再进场信号，继续观望。信号触发条件：恐贪回落到恐惧档(&lt;45) / 技术面分≥3 / MA5金叉MA10 / 净值站上MA10，满足2个以上可分批进场。</div>';
  } else {
    html += '<div class="sl-why" style="background:'+(rebuy.canRebuy?'#f0fdf4':'#fff')+'">';
    html += '已触发 '+rebuy.count+'/4 信号'+(rebuy.canRebuy?' <b style="color:#16a34a">✓ 可分批进场</b>':'（需≥2个）')+'：<br>';
    rebuy.signals.forEach(s=>{ html += '· '+s.name+'：'+s.desc+'<br>'; });
    html += '</div>';
  }

  // ② 分批买入计划
  html += '<div class="sl-line" style="margin-top:6px"><span style="font-weight:700;color:#1e293b">② 买多少钱？</span></div>';
  if(plan.batches.length === 0){
    html += '<div class="sl-why" style="background:#fef2f2">'+plan.advise+'</div>';
  } else {
    html += '<div class="sl-why" style="background:#fff">'+plan.advise+'：</div>';
    plan.batches.forEach(b=>{
      html += '<div class="sl-line"><span>'+b.phase+' <b style="color:#1d4ed8">'+(b.pct*100).toFixed(0)+'%</b>（≈'+fmt(b.amount)+'元）</span><span style="font-size:10px;color:#6b7280">'+b.trigger+'</span></div>';
    });
  }

  // ③ 回本时间测算
  if(rec){
    html += '<div class="sl-line" style="margin-top:6px"><span style="font-weight:700;color:#1e293b">③ 什么时候回本？</span></div>';
    html += '<div class="sl-why" style="background:#fff">';
    html += '假设止损价 '+sl.stopPrice.toFixed(4)+' 卖出剩余 '+shares+' 份：<br>';
    html += '· 止损实现亏损：<b style="color:#dc2626">'+(rec.stopLoss>=0?'+':'')+fmt(rec.stopLoss)+'元</b><br>';
    html += '· 总亏损（含已实现）：<b style="color:#dc2626">'+(rec.totalLoss>=0?'+':'')+fmt(rec.totalLoss)+'元</b>（'+(rec.lossRate*100).toFixed(1)+'%）<br>';
    html += '· 回本需涨：<b style="color:#b45309">+'+(rec.needGain*100).toFixed(1)+'%</b><br>';
    html += '· 板块近1-3年年化 ≈ '+(rec.avgAnnual*100).toFixed(1)+'%，回本预估：<br>';
    const fmtM = (m)=> m==null ? '无法回本(年化为负)' : '约 '+m+' 个月';
    html += '&nbsp;&nbsp;🟢 乐观(年化'+(rec.optimistic.annual*100).toFixed(1)+'%)：'+fmtM(rec.optimistic.months)+'<br>';
    html += '&nbsp;&nbsp;🟡 中性(年化'+(rec.neutral.annual*100).toFixed(1)+'%)：'+fmtM(rec.neutral.months)+'<br>';
    html += '&nbsp;&nbsp;🔴 悲观(年化'+(rec.pessimistic.annual*100).toFixed(1)+'%)：'+fmtM(rec.pessimistic.months);

    html += '<div class="sl-why" style="background:#fffbeb;color:#92400e;font-size:10px;margin-top:4px">⚠️ 回本月数基于板块历史年化估算，不代表未来；若悲观档为"无法回本"，说明该板块长期趋势走弱，需考虑换基。</div>';
  }

  html += '</div></div>';
  return html;
}

/* ============ ☁️ Gist 云同步（v6.3.7）============
   持仓数据存到 GitHub Gist，实现多设备同步。
   读取：Gist raw 链接（公开，不需 token）→ fetch（纯前端可用，但需 CORS）
         GitHub raw 支持 CORS，可直接 fetch。
   写入：GitHub API PATCH /gists/{id} → 需 Personal Access Token（存 localStorage）。
   设置：Gist ID + Token 存 localStorage（GIST_KEY）。 */
const GIST_KEY = "fund_selector_gist_v1";
const GIST_FILENAME = "fund-selector-positions.json";
function getGistConfig(){ try{ return JSON.parse(localStorage.getItem(GIST_KEY)||"{}"); }catch(e){ return {}; } }
function saveGistConfig(cfg){ localStorage.setItem(GIST_KEY, JSON.stringify(cfg)); }
// 读 Gist：通过 raw 链接 fetch（GitHub raw 支持 CORS）
async function readFromGist(gistId){
  if(!gistId) throw new Error("未配置 Gist ID");
  // raw 链接格式：https://gist.githubusercontent.com/{user}/{gistId}/raw/{filename}
  // 不知道 user 名时，用 api.github.com/gists/{id} 先拿 owner（也要 CORS，GitHub API 支持）
  const apiUrl = "https://api.github.com/gists/" + gistId;
  const r = await fetch(apiUrl, { headers: { "Accept":"application/vnd.github+json" } });
  if(!r.ok) throw new Error("Gist 读取失败: HTTP "+r.status);
  const data = await r.json();
  const file = data.files && data.files[GIST_FILENAME];
  if(!file) throw new Error("Gist 中无 "+GIST_FILENAME+" 文件");
  const content = file.content || "[]";
  return JSON.parse(content);
}
// 写 Gist：PATCH /gists/{id}，需 token
async function writeToGist(gistId, token, positions){
  if(!gistId) throw new Error("未配置 Gist ID");
  if(!token) throw new Error("未配置 GitHub Token");
  const apiUrl = "https://api.github.com/gists/" + gistId;
  const body = JSON.stringify({
    description: "选基助手持仓数据 " + new Date().toLocaleString("zh-CN"),
    files: { [GIST_FILENAME]: { content: JSON.stringify(positions, null, 2) } }
  });
  const r = await fetch(apiUrl, {
    method: "PATCH",
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + token,
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: body
  });
  if(!r.ok) {
    const err = await r.text();
    throw new Error("Gist 写入失败: HTTP "+r.status+" "+err.slice(0,100));
  }
  return true;
}

const CUSTOM_KEY = "fund_selector_custom_v1";
function getCustoms(){ try{ return JSON.parse(localStorage.getItem(CUSTOM_KEY)||"[]"); }catch(e){ return []; } }
function saveCustoms(list){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); }
function guessMarket(code){
  // 沪市ETF以51/56/58开头，深市以15/16开头；场外基金返回空
  const c = code.slice(0,2);
  if(["51","56","58"].includes(c)) return "sh";
  if(["15","16"].includes(c)) return "sz";
  return "";
}
async function loadCustomFund(item){
  // 名称解析：优先用 pingzhongdata 的全局缓存；没有则走 searchapi/push2 兜底
  let resolved = (window.__fundNames && window.__fundNames[item.code]) || null;
  if(!resolved){
    resolved = await resolveFundName(item.code, item.market || guessMarket(item.code), item.kind);
    if(resolved && !window.__fundNames) window.__fundNames = {};
    if(resolved) window.__fundNames[item.code] = resolved;
  }

  // 根据解析到的真实名称，自动纠正 kind/market（防止股基同号或用户类型选错，如 002207 被当 ETF）
  let kind = item.kind;
  let market = item.market || guessMarket(item.code);
  if(resolved){
    const inferred = inferKind(resolved);
    if(inferred && inferred !== kind){
      kind = inferred;
      market = (kind === "etf" ? guessMarket(item.code) : "");
    }
  }

  const f = {code:item.code, name:resolved||item.name||item.code, kind, market, mgr:"自选"};
  const d = await loadFund(f);
  d.name = resolved || d.name || item.name || item.code;

  // 把纠正后的名称/类型写回 localStorage
  if(resolved){
    const list = getCustoms();
    const idx = list.findIndex(x=>x.code===item.code);
    if(idx>=0){
      list[idx].name = resolved;
      list[idx].kind = kind;
      list[idx].market = market;
      saveCustoms(list);
    }
  }
  return d;
}

  $("#cusBack").onclick = ()=>{
    box.classList.add("hidden"); box.innerHTML="";
    $("#tabs").classList.remove("hidden"); $("#sectitle").classList.remove("hidden"); $("#cards").classList.remove("hidden");
  };
  $("#cusAdd").onclick = ()=>addCustom();
  $("#cusCode").addEventListener("keydown", (e)=>{ if(e.key==="Enter") addCustom(); });

  // 云同步事件
  $("#gistSave").onclick = ()=>{
    const c = { gistId: $("#gistId").value.trim(), token: $("#gistToken").value.trim() };
    if(!c.gistId || !c.token){ $("#gistStatus").innerHTML = '<span style="color:#dc2626">⚠️ Gist ID 和 Token 都要填</span>'; return; }
    saveGistConfig(c);
    $("#gistStatus").innerHTML = '<span style="color:#16a34a">✅ 配置已保存（仅存本浏览器）</span>';
  };
  $("#gistUpload").onclick = async ()=>{
    const c = getGistConfig();
    if(!c.gistId || !c.token){ $("#gistStatus").innerHTML = '<span style="color:#dc2626">⚠️ 请先填写并保存 Gist ID 和 Token</span>'; return; }
    $("#gistStatus").innerHTML = '<span style="color:#0369a1">⏳ 正在上传…</span>';
    try {
      const list = getCustoms();
      await writeToGist(c.gistId, c.token, list);
      $("#gistStatus").innerHTML = '<span style="color:#16a34a">✅ 已上传 '+list.length+' 只持仓到云（'+new Date().toLocaleTimeString("zh-CN")+'）</span>';
    } catch(e){
      $("#gistStatus").innerHTML = '<span style="color:#dc2626">❌ '+e.message+'</span>';
    }
  };
  $("#gistDownload").onclick = async ()=>{
    const c = getGistConfig();
    if(!c.gistId){ $("#gistStatus").innerHTML = '<span style="color:#dc2626">⚠️ 请先填写 Gist ID</span>'; return; }
    $("#gistStatus").innerHTML = '<span style="color:#0369a1">⏳ 正在下载…</span>';
    try {
      const cloudList = await readFromGist(c.gistId);
      if(!Array.isArray(cloudList)) throw new Error("云端数据格式错误");
      // 询问是否覆盖
      const localList = getCustoms();
      if(localList.length > 0 && !confirm("本地有 "+localList.length+" 只持仓，云端有 "+cloudList.length+" 只。确定用云端覆盖本地吗？（本地数据会丢失）")){
        $("#gistStatus").innerHTML = '<span style="color:#9ca3af">已取消</span>';
        return;
      }
      saveCustoms(cloudList);
      $("#gistStatus").innerHTML = '<span style="color:#16a34a">✅ 已从云下载 '+cloudList.length+' 只持仓，覆盖本地</span>';
      refreshCustomList();
    } catch(e){
      $("#gistStatus").innerHTML = '<span style="color:#dc2626">❌ '+e.message+'</span>';
    }
  };

  refreshCustomList();
}
async function addCustom(){
  const code = $("#cusCode").value.trim();
  if(!/^\d{6}$/.test(code)){ alert("请输入6位基金代码"); return; }
  const type = $("#cusType").value;
  let kind="fund", market="";
  if(type==="etf-sh"){ kind="etf"; market="sh"; }
  else if(type==="etf-sz"){ kind="etf"; market="sz"; }

  // 持仓数据（可选）
  const costRaw = $("#cusCost").value.trim();
  const sharesRaw = $("#cusShares").value.trim();
  let cost = null, shares = null;
  if(costRaw){ cost = parseFloat(costRaw); if(isNaN(cost)||cost<=0){ alert("成本净值要填正数"); return; } }
  if(sharesRaw){ shares = parseFloat(sharesRaw); if(isNaN(shares)||shares<=0){ alert("持有份额要填正数"); return; } }
  // 二者要么都填、要么都不填
  if((cost!=null) !== (shares!=null)){ alert("成本净值和持有份额需同时填写，或同时留空（仅观察）"); return; }

  // 添加前先解析真实名称并自动纠正类型（防止股基同号或类型选错，如 002207 实际是场外基金）
  const resolved = await resolveFundName(code, market, kind).catch(()=>null);
  if(resolved){
    const inferred = inferKind(resolved);
    if(inferred && inferred !== kind){
      kind = inferred;
      market = (kind === "etf" ? guessMarket(code) : "");
    }
  }

  const list = getCustoms();
  if(list.some(x=>x.code===code)){ alert("该基金已在持仓列表"); return; }
  const item = {code, kind, market, name:resolved||code};
  if(cost!=null && shares!=null){ item.cost = cost; item.shares = shares; }
  list.push(item);
  saveCustoms(list);
  $("#cusCode").value = "";
  $("#cusCost").value = "";
  $("#cusShares").value = "";
  refreshCustomList();
}
function removeCustom(code){
  let list = getCustoms().filter(x=>x.code!==code);
  saveCustoms(list);
  refreshCustomList();
}
async function refreshCustomList(){
  const box = $("#cusList"); box.innerHTML = "";
  // 先拉一次当前板块恐贪，填充 window.__marketSentiment 供止损止盈引用（切到对应板块再开持仓更准）
  await loadSentiment(current).catch(()=>{});
  const list = getCustoms();
  if(!list.length){
    box.innerHTML = '<div class="ctitle">我的持仓<small>暂无，请在上方添加</small></div>';
    return;
  }
  const hasPos = list.some(x=>x.cost!=null && x.shares!=null);
  box.innerHTML = '<div class="ctitle">我的持仓<small>共 '+list.length+' 只'+(hasPos?' · 含盈亏与止损止盈线':'')+'</small></div>';

  // 汇总占位（先显示加载中，等数据加载完再填充）
  const summaryHolder = document.createElement("div");
  summaryHolder.innerHTML = '<div class="summary-box"><div class="summary-title">📊 持仓汇总</div><div style="text-align:center;padding:10px;font-size:12px;opacity:.7">加载中…</div></div>';
  box.appendChild(summaryHolder.firstElementChild);

  const holder = document.createElement("div");
  holder.className = "clist";
  box.appendChild(holder);
  // 排序表占位
  const rankHolder = document.createElement("div");

  // 并行加载持仓基金
  const ds = await Promise.all(list.map(loadCustomFund));
  // 并行拉每只持仓基金对应板块的恐贪分（v6.3.3：每只用自己板块的，不再共用当前 tab）
  const sents = await Promise.all(ds.map(d=> getSentimentForFund(d.code, d.name).catch(()=>null) ));
  holder.innerHTML = "";
  ds.forEach((d,i)=>{
    const el = cardEl(d);
    const item = list[i]; // 原始持仓数据（含 cost/shares/realized）
    const fundSent = sents[i]; // 该基金对应板块的恐贪分
    // 给标题加删除按钮
    const top = el.querySelector(".fc-top div:first-child");
    top.innerHTML += '<span class="del-btn" data-code="'+d.code+'">删除</span>';
    el.querySelector(".del-btn").onclick = (e)=>{ removeCustom(e.target.dataset.code); };
    // 追加持仓盈亏 + 止损止盈框
    const posHtml = posBoxHtml(item, d, fundSent);
    if(posHtml){
      const wrap = document.createElement("div");
      wrap.innerHTML = posHtml;
      el.appendChild(wrap.firstElementChild);
      // 绑定"改成本/份额"和"已实现盈亏"
      el.querySelectorAll(".pos-edit").forEach(btn=>{
        btn.onclick = ()=> editPos(item);
      });
      const ri = el.querySelector(".realized-input");
      if(ri){
        ri.onchange = ()=> saveRealized(item, ri.value);
      }
    }
    holder.appendChild(el);
  });

  // 持仓汇总 + 亏损排序（v6.3.8）
  const sumResult = summaryBoxHtml(list, ds);
  if(sumResult.summary){
    // 替换顶部占位
    const oldSummary = box.querySelector(".summary-box");
    if(oldSummary) oldSummary.outerHTML = sumResult.summary;
    // 排序表追加到列表后面
    if(sumResult.rank){
      holder.insertAdjacentHTML("afterend", sumResult.rank);
    }
  } else {
    // 没有持仓数据（都没填成本份额），移除占位
    const oldSummary = box.querySelector(".summary-box");
    if(oldSummary) oldSummary.remove();
  }
  // 不再做跨板块对比：持仓跨多板块，与"当前板块 Top3"对比无意义
}
// 保存已实现盈亏
function saveRealized(item, val){
  const list = getCustoms();
  const idx = list.findIndex(x=>x.code===item.code);
  if(idx<0) return;
  const v = parseFloat(val);
  if(isNaN(v)){ delete list[idx].realized; }
  else { list[idx].realized = v; }
  saveCustoms(list);
  // 局部刷新当前卡片（只刷一个，避免全部重拉数据）
  const allHolders = document.querySelectorAll("#cusList .fcard");
  // 简化：直接调 refreshCustomList（重新拉数据，但用户感知是立刻更新）
  refreshCustomList();
}
// 编辑某只持仓的成本/份额
function editPos(item){
  const cost = prompt("修改成本净值（元/份），留空则清除持仓数据仅作观察", item.cost||"");
  if(cost===null) return;
  const shares = prompt("修改持有份额（份），留空则清除持仓数据仅作观察", item.shares||"");
  if(shares===null) return;
  const list = getCustoms();
  const idx = list.findIndex(x=>x.code===item.code);
  if(idx<0) return;
  if(cost==="" || shares===""){
    delete list[idx].cost; delete list[idx].shares;
  } else {
    const c = parseFloat(cost), s = parseFloat(shares);
    if(isNaN(c)||c<=0||isNaN(s)||s<=0){ alert("请填正数"); return; }
    list[idx].cost = c; list[idx].shares = s;
  }
  saveCustoms(list);
  refreshCustomList();
}

/* ============ 事件 ============ */
$("#refreshBtn").onclick = ()=>{
  if(!$("#custom").classList.contains("hidden")) renderCustom();
  else if($("#overview").classList.contains("hidden")) renderCards();
  else renderOverview();
};
$("#ovBtn").onclick = ()=>{ $("#custom").classList.add("hidden"); renderOverview(); };
$("#cusBtn").onclick = ()=>{ $("#overview").classList.add("hidden"); renderCustom(); };
$("#favBtn").onclick = ()=>{ renderFavs(); $("#mask").classList.add("show"); $("#modal").classList.add("show"); };
$("#closeModal").onclick = ()=>{ $("#mask").classList.remove("show"); $("#modal").classList.remove("show"); };
$("#mask").onclick = ()=>{ $("#mask").classList.remove("show"); $("#modal").classList.remove("show"); };

/* ============ 初始化 ============ */
$("#favCount").textContent = getFavs().length;
renderTabs();
renderCards();
</script>
